<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d2394a">
<link rel="manifest" href="vocab.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>지텔프 무한 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 단어 카드 한 장이 화면 가운데, 위엔 덱·모드, 아래엔 숙련도 띠. 지텔프 65 작전과 같은 OMR 답안지 계열 */
:root{
  --paper:#f6f7fb; --sheet:#ffffff; --ink:#1b1e2b; --muted:#666a7a;
  --accent:#d2394a; --accent-soft:#fbe3e5; --line:#dfe2ec;
  --ok:#1f8a5b; --ok-soft:#dff3e9; --bad:#c2410c; --bad-soft:#fde8dc;
  --b0:#e7e9f1; --b1:#f6c1c7; --b2:#f09aa5; --b3:#e5707f; --b4:#d2394a; --b5:#1f8a5b;
  --display:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14151c; --sheet:#1e2029; --ink:#ecedf2; --muted:#a2a5b4; --accent:#ff6b78; --accent-soft:#3a2226; --line:#343746;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418;
  --b0:#2c2f3c; --b1:#4d2a31; --b2:#743640; --b3:#a3434f; --b4:#ff6b78; --b5:#4fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14151c; --sheet:#1e2029; --ink:#ecedf2; --muted:#a2a5b4; --accent:#ff6b78; --accent-soft:#3a2226; --line:#343746;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418;
  --b0:#2c2f3c; --b1:#4d2a31; --b2:#743640; --b3:#a3434f; --b4:#ff6b78; --b5:#4fd39a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
h2{font-size:16px;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* 숙련도 띠 */
.mastery{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--b0)}
.mastery i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:20px}
.stats span{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* 카드 */
.card{position:relative;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:28px 18px;width:100%}
button.card{cursor:pointer}
.card .w{font-family:var(--mono);font-size:clamp(30px,8vw,44px);font-weight:700;word-break:break-word;line-height:1.15}
.card .ko{font-size:clamp(22px,6vw,30px);font-weight:700;line-height:1.3}
.card .syn{font-size:16px;color:var(--muted)}
.card .hint{font-size:13px;color:var(--muted)}
.card .corner{position:absolute;top:10px;font-size:12px;color:var(--muted)}
.card .corner.l{left:14px} .card .corner.r{right:14px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--b0)}
.dots i.on{background:var(--accent)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer .btn{padding:13px;font-size:16px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:52px}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}
.flash{font-weight:700;text-align:center}
.flash.ok{color:var(--ok)} .flash.no{color:var(--bad)}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--accent)}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* 목록 */
input[type=search],select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 180px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.card,.opt{transition:background .15s,border-color .15s}}
</style>

</head>

spontaneous|자발적인|unplanned, natural
stable|안정된|steady, secure
stand|견디다|tolerate, endure
steady|꾸준한|constant, regular
steep|가파른, 급격한|sharp, sudden
stimulate|자극하다|encourage, spark
strive|노력하다|try, struggle
submit|제출하다|hand in, turn in
subsequent|그 후의|following, later
substantial|상당한|considerable, large
subtle|미묘한|slight, delicate
sufficient|충분한|enough, adequate
superior|우수한|better, higher
supplement|보충하다|add to, complement
suppress|억누르다|hold back, restrain
surpass|능가하다|exceed, outdo
susceptible|영향받기 쉬운|vulnerable, sensitive
suspend|중단하다|stop, pause
sustain|지속시키다|maintain, support
tangible|실체적인|concrete, real
tentative|잠정적인|provisional, temporary
term|기간; 용어|period, word
terminate|끝내다|end, stop
thrive|번창하다|flourish, prosper
transform|변형시키다|change, convert
treat|다루다; 치료하다|handle, cure
tremendous|엄청난|huge, enormous
trivial|사소한|minor, unimportant
ultimately|궁극적으로|finally, eventually
undergo|겪다|go through, experience
unique|독특한|distinctive, one of a kind
uphold|지지하다, 유지하다|support, maintain
utilize|이용하다|use, employ
vast|광대한|huge, immense
versatile|다재다능한|adaptable, flexible
viable|실행 가능한|workable, feasible
virtually|사실상|almost, nearly
vital|필수적인|essential, crucial
vivid|생생한|clear, lively
widespread|널리 퍼진|common, extensive
withstand|견디다|resist, endure
witness|목격하다|see, observe
yield|산출하다; 양보하다|produce, give way
zealous|열성적인|eager, passionate
`;
const VOCAB = VOCAB_RAW.trim().split('\n').map(l => { const [w, m, s] = l.split('|'); return { w, m, s }; });
</script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const W = VOCAB.map((v, i) => Object.assign({ i }, v));
const BY = Object.fromEntries(W.map(v => [v.w, v]));

/* 저장: 숙련도 0~5 (0 = 모름/새 단어, 5 = 완전히 앎) */
const KEY = 'gtelp-vocab-v1';
const blank = () => ({ box:{}, seen:{}, miss:{}, star:{}, days:{}, total:0, right:0, run:0, best:0, deck:'all', mode:'card', dir:'en', qtype:'mix', gap:3, ko:true, hideList:false });
let S; try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const box = w => S.box[w] || 0;

/* ── 덱 ── */
const CH = 80;
function decks(){
  const d = [['all', '전체 ' + W.length]];
  for (let i = 0; i < W.length; i += CH) d.push(['r' + i, (i + 1) + '~' + Math.min(W.length, i + CH)]);
  d.push(['weak', '아직 모름 ' + W.filter(v => box(v.w) < 3).length]);
  d.push(['miss', '자주 틀림 ' + W.filter(v => (S.miss[v.w] || 0) >= 2).length]);
  d.push(['star', '★ ' + Object.keys(S.star).length]);
  return d;
}
function pool(){
  const k = S.deck;
  let p = W;
  if (k[0] === 'r') { const s = +k.slice(1); p = W.slice(s, s + CH); }
  else if (k === 'weak') p = W.filter(v => box(v.w) < 3);
  else if (k === 'miss') p = W.filter(v => (S.miss[v.w] || 0) >= 2);
  else if (k === 'star') p = W.filter(v => S.star[v.w]);
  return p.length ? p : W;   // 빈 덱이면 전체로 계속
}

/* ── 무한 반복 선택기: 모르는 단어일수록 자주, 틀린 단어는 3장 뒤 다시 ── */
const WEIGHT = [10, 6, 4, 2.5, 1.2, 0.5];
let recent = [], soon = [];
function nextWord(){
  soon.forEach(s => s.after--);
  const due = soon.findIndex(s => s.after <= 0);
  if (due > -1) { const w = soon.splice(due, 1)[0].w; return BY[w]; }
  const p = pool();
  const avoid = new Set(recent.slice(-Math.min(6, p.length - 1)));
  const cand = p.filter(v => !avoid.has(v.w));
  let sum = 0; cand.forEach(v => sum += WEIGHT[box(v.w)]);
  let r = Math.random() * sum;
  for (const v of cand) { r -= WEIGHT[box(v.w)]; if (r <= 0) return v; }
  return cand[cand.length - 1] || p[0];
}
function mark(v, ok){
  S.total++; S.seen[v.w] = (S.seen[v.w] || 0) + 1;
  const t = today(); S.days[t] = (S.days[t] || 0) + 1;
  if (ok) { S.right++; S.run++; S.best = Math.max(S.best, S.run); S.box[v.w] = Math.min(5, box(v.w) + 1); }
  else { S.run = 0; S.miss[v.w] = (S.miss[v.w] || 0) + 1; S.box[v.w] = 0; soon.push({ w:v.w, after:3 }); }
  recent.push(v.w); if (recent.length > 20) recent.shift();
  save();
}

/* ── 음성 ── */
const synth = window.speechSynthesis;
function voice(lang){ if (!synth) return null; const vs = synth.getVoices(); return vs.find(v => v.lang.replace('_', '-').startsWith(lang) && /google|samantha|yuna|natural/i.test(v.name)) || vs.find(v => v.lang.replace('_', '-').startsWith(lang)) || null; }
function say(text, lang, done){
  if (!synth) { if (done) setTimeout(done, 900); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
  const v = voice(lang === 'ko' ? 'ko' : 'en-US') || voice(lang === 'ko' ? 'ko' : 'en'); if (v) u.voice = v;
  u.rate = lang === 'ko' ? 1.05 : 0.9;
  let fired = false; const fin = () => { if (!fired) { fired = true; if (done) done(); } };
  u.onend = fin; u.onerror = fin; setTimeout(fin, 6000);   // 음성이 없거나 멈춰도 다음으로
  synth.speak(u);
}
const stopVoice = () => { if (synth) synth.cancel(); };

/* ── 화면 상태 ── */
let view = 'study', cur = null, flipped = false, quiz = null, autoOn = false, autoStep = 0, autoT = null, q = '', fb = null;

function header(){
  const counts = [0, 0, 0, 0, 0, 0]; W.forEach(v => counts[box(v.w)]++);
  const acc = S.total ? Math.round(S.right / S.total * 100) : 0;
  return `<div class="row between"><h1>지텔프 무한 단어장</h1>
      <div class="seg" role="group" aria-label="화면"><button data-view="study" aria-pressed="${view === 'study'}">학습</button><button data-view="list" aria-pressed="${view === 'list'}">단어 목록</button></div></div>
    <section class="panel">
      <div class="stats"><div><b>${S.days[today()] || 0}</b><span>오늘 본 카드</span></div><div><b>${S.total}</b><span>누적</span></div><div><b>${acc}%</b><span>정답률</span></div><div><b>${S.run}</b><span>연속 정답 · 최고 ${S.best}</span></div></div>
      <div class="mastery" role="img" aria-label="숙련도 분포">${counts.map((c, b) => `<i style="width:${c / W.length * 100}%;background:var(--b${b})"></i>`).join('')}</div>
      <div class="legend">${['새·모름', '1', '2', '3', '4', '완전히 앎'].map((t, b) => `<span style="--c:var(--b${b})">${t} <b class="num">${counts[b]}</b></span>`).join('')}</div>
    </section>`;
}
const dots = w => `<span class="dots" aria-label="숙련도 ${box(w)}/5">${[1, 2, 3, 4, 5].map(i => `<i class="${box(w) >= i ? 'on' : ''}"></i>`).join('')}</span>`;

function viewStudy(){
  let h = `<div class="row">${decks().map(([k, t]) => `<button class="chip" data-deck="${k}" aria-pressed="${S.deck === k}">${t}</button>`).join('')}</div>
    <div class="row between"><div class="seg" role="group" aria-label="모드">
      <button data-mode="card" aria-pressed="${S.mode === 'card'}">카드</button><button data-mode="quiz" aria-pressed="${S.mode === 'quiz'}">4지선다</button><button data-mode="auto" aria-pressed="${S.mode === 'auto'}">자동 재생</button></div>`;
  if (S.mode === 'card') h += `<div class="seg" role="group" aria-label="앞면"><button data-dir="en" aria-pressed="${S.dir === 'en'}">영→한</button><button data-dir="ko" aria-pressed="${S.dir === 'ko'}">한→영</button></div>`;
  if (S.mode === 'quiz') h += `<select id="qtype" aria-label="문제 종류">${[['mix', '섞어서'], ['meaning', '뜻 고르기'], ['word', '단어 고르기'], ['syn', '동의어 고르기']].map(([k, t]) => `<option value="${k}" ${S.qtype === k ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  if (S.mode === 'auto') h += `<span class="row"><select id="gap" aria-label="간격">${[2, 3, 5].map(g => `<option value="${g}" ${S.gap === g ? 'selected' : ''}>${g}초 간격</option>`).join('')}</select>
      <label class="toggle"><input type="checkbox" id="ko" ${S.ko ? 'checked' : ''}> 뜻도 읽기</label></span>`;
  h += `</div>`;

  if (!cur) cur = nextWord();
  const v = cur;
  if (S.mode === 'card') {
    const front = S.dir === 'en' ? `<span class="w">${esc(v.w)}</span>` : `<span class="ko">${esc(v.m)}</span>`;
    const back = S.dir === 'en' ? `<span class="w">${esc(v.w)}</span><span class="ko">${esc(v.m)}</span>` : `<span class="ko">${esc(v.m)}</span><span class="w">${esc(v.w)}</span>`;
    h += `<button class="card" data-flip aria-label="카드 뒤집기"><span class="corner l num">#${v.i + 1} ${dots(v.w)}</span>
      ${flipped ? back + `<span class="syn">≈ ${esc(v.s)}</span>` : front + `<span class="hint">눌러서 ${S.dir === 'en' ? '뜻' : '단어'} 보기</span>`}</button>
      <div class="row between"><button class="star" data-star="${esc(v.w)}" aria-pressed="${!!S.star[v.w]}" aria-label="별표">${S.star[v.w] ? '★' : '☆'}</button>
        <button class="btn small" data-say="${esc(v.w)}">발음 듣기</button></div>
      <div class="answer"><button class="btn" data-know="0" ${flipped ? '' : 'disabled'}>몰라요 <span class="kbd">←</span></button><button class="btn primary" data-know="1" ${flipped ? '' : 'disabled'}>알아요 <span class="kbd">→</span></button></div>
      <p class="muted" style="text-align:center;font-size:13px">끝이 없어요. 모르는 단어는 3장 뒤에 다시, 아는 단어는 점점 드물게 나와요. <span class="kbd">Space</span> 뒤집기</p>`;
  } else if (S.mode === 'quiz') {
    if (!quiz || quiz.v !== v) quiz = makeQuiz(v);
    const done = quiz.pick !== null;
    h += `<div class="card" style="min-height:170px"><span class="corner l num">#${v.i + 1} ${dots(v.w)}</span><span class="corner r label">${quiz.label}</span>
      ${quiz.type === 'word' ? `<span class="ko">${esc(v.m)}</span>` : `<span class="w">${esc(v.w)}</span>`}
      ${quiz.type === 'syn' ? '<span class="hint">문맥상 같은 뜻은?</span>' : ''}</div>
      <div class="opts">${quiz.opts.map((o, k) => {
        let c = 'opt'; if (done) { if (o === quiz.ans) c += ' right'; else if (k === quiz.pick) c += ' wrong'; }
        return `<button class="${c}" data-opt="${k}" ${done ? 'disabled' : ''}><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`; }).join('')}</div>`;
    if (done) {
      const ok = quiz.opts[quiz.pick] === quiz.ans;
      h += `<p class="flash ${ok ? 'ok' : 'no'}">${ok ? '정답' : '오답'} · ${esc(v.w)} = ${esc(v.m)} ≈ ${esc(v.s)}</p>
        ${ok ? '' : `<button class="btn primary" data-next style="align-self:center">다음 <span class="kbd">Enter</span></button>`}`;
    } else h += `<p class="muted" style="text-align:center;font-size:13px">숫자키 <span class="kbd">1</span>~<span class="kbd">4</span>로도 골라요. 맞히면 바로 다음 단어.</p>`;
  } else {
    h += `<div class="card"><span class="corner l num">#${v.i + 1} ${dots(v.w)}</span>
      <span class="w">${esc(v.w)}</span>${autoStep >= 1 ? `<span class="ko">${esc(v.m)}</span><span class="syn">≈ ${esc(v.s)}</span>` : '<span class="hint">뜻을 떠올려 보세요</span>'}</div>
      <div class="row" style="justify-content:center"><button class="btn ${autoOn ? '' : 'primary'}" data-auto>${autoOn ? '■ 멈추기' : '▶ 시작'}</button>
        <button class="btn" data-skip>다음 단어</button><button class="star" data-star="${esc(v.w)}" aria-pressed="${!!S.star[v.w]}" aria-label="별표">${S.star[v.w] ? '★' : '☆'}</button></div>
      <p class="muted" style="text-align:center;font-size:13px">화면을 안 봐도 돼요. 단어를 영어로 읽고, 잠시 뒤 뜻을 보여 주고 읽어 준 다음, 멈출 때까지 계속 넘어가요. 소리가 안 나면 기기 설정에서 영어·한국어 음성을 받아 두세요.</p>`;
  }
  return h;
}
function makeQuiz(v){
  let type = S.qtype === 'mix' ? ['meaning', 'word', 'syn'][Math.floor(Math.random() * 3)] : S.qtype;
  const others = shuffle(W.filter(x => x !== v));
  let ans, opts;
  if (type === 'meaning') { ans = v.m; opts = others.filter(x => x.m !== v.m).slice(0, 3).map(x => x.m); }
  else if (type === 'word') { ans = v.w; opts = others.slice(0, 3).map(x => x.w); }
  else {
    ans = v.s.split(', ')[0];
    opts = others.filter(x => !x.s.includes(ans) && !v.s.includes(x.s.split(', ')[0]) && x.w !== ans).slice(0, 3).map(x => x.s.split(', ')[0]);
  }
  return { v, type, ans, opts: shuffle([ans].concat(opts)), pick:null, label: { meaning:'뜻 고르기', word:'단어 고르기', syn:'동의어 고르기' }[type] };
}

function viewList(){
  const qq = q.trim().toLowerCase();
  const list = W.filter(v => !qq || v.w.toLowerCase().includes(qq) || v.m.includes(qq) || v.s.toLowerCase().includes(qq));
  return `<div class="row"><input type="search" id="q" placeholder="단어·뜻·동의어 찾기" value="${esc(q)}" aria-label="단어 찾기">
      <label class="toggle"><input type="checkbox" id="hide" ${S.hideList ? 'checked' : ''}> 뜻 가리기</label>
      <span class="label num">${list.length}개</span></div>
    <section class="panel"><div class="scroll"><table>
      <tr><th></th><th>#</th><th>단어</th><th>뜻</th><th>동의어</th><th>숙련도</th><th>틀림</th></tr>
      ${list.map(v => `<tr><td><button class="star" data-star="${esc(v.w)}" aria-pressed="${!!S.star[v.w]}" aria-label="${esc(v.w)} 별표">${S.star[v.w] ? '★' : '☆'}</button></td>
        <td class="num muted">${v.i + 1}</td><td class="num"><b>${esc(v.w)}</b></td>
        <td style="${S.hideList ? 'color:transparent;background:var(--accent-soft);border-radius:4px' : ''}">${esc(v.m)}</td>
        <td class="muted" style="${S.hideList ? 'color:transparent' : ''}">${esc(v.s)}</td><td>${dots(v.w)}</td><td class="num muted">${S.miss[v.w] || ''}</td></tr>`).join('')}
    </table></div></section>
    <section class="panel"><h2>기록</h2><p class="muted">기록은 이 기기의 브라우저에만 저장돼요.</p>
      <button class="btn small" data-reset style="align-self:flex-start">${resetArm ? '한 번 더 누르면 모두 삭제' : '기록 모두 지우기'}</button></section>`;
}
let resetArm = false;

function render(){
  app.innerHTML = header() + (view === 'study' ? viewStudy() : viewList());
}
function advance(){ cur = nextWord(); flipped = false; quiz = null; autoStep = 0; render(); }

/* ── 자동 재생 루프 ── */
function autoLoop(){
  if (!autoOn || S.mode !== 'auto') return;
  const v = cur; autoStep = 0; render();
  say(v.w, 'en', () => {
    if (!autoOn) return;
    autoT = setTimeout(() => {
      if (!autoOn) return;
      autoStep = 1; render();
      const after = () => { if (!autoOn) return; autoT = setTimeout(() => { if (!autoOn) return;
        S.total++; S.seen[v.w] = (S.seen[v.w] || 0) + 1; const t = today(); S.days[t] = (S.days[t] || 0) + 1; save();
        recent.push(v.w); if (recent.length > 20) recent.shift();
        cur = nextWord(); autoLoop(); }, S.gap * 1000); };
      if (S.ko) say(v.m, 'ko', after); else after();
    }, S.gap * 1000);
  });
}
function stopAuto(){ autoOn = false; clearTimeout(autoT); stopVoice(); }

/* ── 이벤트 ── */
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.view) { stopAuto(); view = d.view; return render(); }
  if (d.deck) { stopAuto(); S.deck = d.deck; save(); soon = []; return advance(); }
  if (d.mode) { stopAuto(); S.mode = d.mode; save(); return advance(); }
  if (d.dir) { S.dir = d.dir; save(); flipped = false; return render(); }
  if (d.flip !== undefined) { flipped = !flipped; if (flipped && S.dir === 'ko') say(cur.w, 'en'); return render(); }
  if (d.know) { mark(cur, d.know === '1'); return advance(); }
  if (d.say) return say(d.say, 'en');
  if (d.star) { if (S.star[d.star]) delete S.star[d.star]; else S.star[d.star] = 1; save(); const y = scrollY; render(); scrollTo(0, y); return; }
  if (d.opt !== undefined) return pickOpt(+d.opt);
  if (d.next !== undefined) return advance();
  if (d.auto !== undefined) { if (autoOn) { stopAuto(); render(); } else { autoOn = true; autoLoop(); } return; }
  if (d.skip !== undefined) { const on = autoOn; stopAuto(); cur = nextWord(); autoStep = 0; if (on) { autoOn = true; autoLoop(); } else render(); return; }
  if (d.reset !== undefined) { if (!resetArm) { resetArm = true; return render(); } resetArm = false; const keep = { deck:S.deck, mode:S.mode }; S = Object.assign(blank(), keep); save(); return render(); }
});
function pickOpt(k){
  if (!quiz || quiz.pick !== null || !quiz.opts[k]) return;
  quiz.pick = k; const ok = quiz.opts[k] === quiz.ans;
  mark(cur, ok); render();
  if (ok) setTimeout(() => { if (quiz && quiz.pick !== null && S.mode === 'quiz' && view === 'study') advance(); }, 750);
}
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'qtype') { S.qtype = t.value; save(); quiz = null; render(); }
  if (t.id === 'gap') { S.gap = +t.value; save(); }
  if (t.id === 'ko') { S.ko = t.checked; save(); }
  if (t.id === 'hide') { S.hideList = t.checked; save(); render(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (view !== 'study' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (S.mode === 'card') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; render(); }
    else if (flipped && e.key === 'ArrowRight') { mark(cur, true); advance(); }
    else if (flipped && e.key === 'ArrowLeft') { mark(cur, false); advance(); }
  } else if (S.mode === 'quiz') {
    if (/^[1-4]$/.test(e.key)) pickOpt(+e.key - 1);
    else if (e.key === 'Enter' && quiz && quiz.pick !== null) { e.preventDefault(); advance(); }
  } else if (S.mode === 'auto' && e.key === ' ') { e.preventDefault(); if (autoOn) { stopAuto(); render(); } else { autoOn = true; autoLoop(); } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && autoOn) { stopAuto(); render(); } });
render();
})();
</script>

</body>
</html>
