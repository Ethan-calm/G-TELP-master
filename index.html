<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d2394a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>지텔프 65 작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: 시험지 OMR 답안지 — 빨간 인쇄선, 컴퓨터용 사인펜으로 칠하는 동그라미 보기, 아래 고정 탭 */
:root{
  --paper:#fbfaf7; --sheet:#ffffff; --ink:#1d1f24; --muted:#6b6862;
  --omr:#d2394a; --omr-soft:#fbe3e5; --line:#ecc9cd;
  --ok:#1f8a5b; --ok-soft:#dff3e9; --bad:#c2410c; --bad-soft:#fde8dc;
  --display:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16171b; --sheet:#1f2126; --ink:#ecebe8; --muted:#a19d96;
  --omr:#ff6b78; --omr-soft:#3a2226; --line:#4a3236;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171b; --sheet:#1f2126; --ink:#ecebe8; --muted:#a19d96;
  --omr:#ff6b78; --omr-soft:#3a2226; --line:#4a3236;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:19px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
a.btn{color:var(--ink);text-decoration:none}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--omr);color:#fff;border-color:var(--omr)}

/* 상단 D-day 띠 */
.dday{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;
  border-bottom:2px solid var(--omr);padding-bottom:12px}
.dday .big{font-family:var(--display);font-size:56px;line-height:1;color:var(--omr);grid-row:span 2}
.dday .t{font-weight:700;font-size:17px}
.bar{height:8px;background:var(--omr-soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--omr)}

/* 미션 */
.mission{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.mission:first-of-type{border-top:0}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.mission .go{font-size:13px}

/* OMR 보기 */
.q{font-size:17px;line-height:1.65}
.q .blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;
  background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px}
.bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.opt.picked .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}
.explain{border-left:3px solid var(--omr);padding:6px 12px;background:var(--omr-soft);border-radius:0 6px 6px 0}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

/* 공식 카드 */
.formula{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ftile{text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);display:flex;flex-direction:column;gap:4px}
.ftile b{font-size:15px}
.ftile small{color:var(--muted);font-size:12.5px;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}

.passage{white-space:pre-wrap;font-size:15.5px;line-height:1.75;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper)}
.card{min-height:180px;display:grid;place-items:center;text-align:center;border:1.5px dashed var(--omr);border-radius:12px;padding:20px;background:var(--sheet);width:100%}
.card .w{font-family:var(--mono);font-size:30px;font-weight:700}
.stat{display:grid;grid-template-columns:72px 1fr 52px;gap:8px;align-items:center;font-size:14px}
input[type=range]{width:100%;accent-color:var(--omr)}
input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 90px;min-width:0}
.score-big{font-family:var(--display);font-size:44px;line-height:1}
.pass{color:var(--ok)} .fail{color:var(--bad)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:2px solid var(--omr);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;padding:4px 0}
nav.tabs a .ic{font-family:var(--display);font-size:18px;line-height:1.2}
nav.tabs a[aria-current="page"]{color:var(--omr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:6}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
</style>

</head>

<script>
/* G-TELP Level 2 study data. 모든 문제·지문은 이 앱용으로 직접 쓴 연습 문항입니다.
   문법: [유형, 문장, 정답, 오답1, 오답2, 오답3, 해설]  (보기는 화면에서 섞음) */
const TYPES = {
  tense:  { name: '시제', n: 6, tip: '진행형이 정답. 단서 부사구로 6가지 진행형 중 고른다.' },
  cond:   { name: '가정법', n: 6, tip: 'If 과거 → would+동사원형 / If had p.p. → would have p.p. / 도치 Were·Had' },
  verbal: { name: '준동사', n: 6, tip: '동사 뒤 -ing냐 to V냐. having p.p.·to have p.p.는 거의 오답.' },
  subj:   { name: '당위성', n: 2, tip: 'suggest·recommend·important 등 + that S + 동사원형' },
  modal:  { name: '조동사', n: 2, tip: '문장 해석: 의무 must / 충고 should / 능력 can / 추측 may' },
  rel:    { name: '관계사', n: 2, tip: '콤마 뒤 that 불가. 사람 who, 사물 which, 장소 where, 소유 whose' },
  conj:   { name: '연결어', n: 2, tip: '앞뒤 문장 관계: 역접 However / 결과 Therefore / 추가 Moreover / 아니면 Otherwise' },
};

const GRAMMAR = [
// ── 시제 ──
['tense','Right now, Mia ___ for her final exam in the library.','is studying','studies','has studied','will study','Right now(지금) → 현재진행 is -ing.'],
['tense','Kevin ___ at the bank for ten years by the time he retires next month.','will have been working','has been working','had been working','will work','by the time + 현재동사(retires) + for 기간 → 미래완료진행 will have been -ing.'],
['tense','The guests ___ for over an hour when the bride finally arrived.','had been waiting','have been waiting','were waiting','will have been waiting','과거 시점(arrived)보다 앞서 + for 기간 → 과거완료진행 had been -ing.'],
['tense','Since 2019, the city ___ new bike lanes across downtown.','has been building','had been building','is building','builds','Since + 과거시점 → 현재완료진행 has been -ing.'],
['tense','When the power went out last night, my family ___ a movie.','was watching','is watching','has been watching','watches','when + 과거동사(went out), last night → 과거진행 was -ing.'],
['tense','If you call me at 9 p.m. tomorrow, I ___ my presentation.','will be practicing','practice','am practicing','have been practicing','tomorrow, if/when + 현재동사 → 미래진행 will be -ing.'],
['tense','These days, more people ___ electric cars because of rising fuel prices.','are buying','bought','had bought','will have bought','These days(요즘) → 현재진행.'],
['tense','Jake ___ in the garden at the moment, so he can\'t answer the phone.','is working','works','worked','has worked','at the moment → 현재진행.'],
['tense','By next June, Dr. Lee ___ the disease for two decades.','will have been studying','has been studying','had been studying','is studying','By + 미래시점(next June) + for 기간 → 미래완료진행.'],
['tense','Before she moved to Seoul in 2020, Anna ___ English in Busan for five years.','had been teaching','has been teaching','was teaching','will have been teaching','과거(moved in 2020) 이전부터 + for 기간 → 과거완료진행.'],
['tense','Ever since he got the promotion, Tom ___ late every night.','has been working','had been working','works','will be working','ever since + 과거 → 현재완료진행.'],
['tense','While the chef ___ the sauce, a fire alarm suddenly went off.','was stirring','is stirring','has been stirring','stirs','while + 과거 사건(went off) → 과거진행.'],
['tense','Next Saturday, our team ___ in the national robotics competition.','will be competing','competes','has been competing','was competing','Next Saturday(미래 시점) → 미래진행.'],
['tense','Currently, scientists ___ a new vaccine against the virus.','are developing','developed','had developed','will have developed','Currently → 현재진행.'],
['tense','My brother ___ video games since he came home three hours ago.','has been playing','is playing','had been playing','will be playing','since + 과거 (지금까지 계속) → 현재완료진행.'],
['tense','By the time the rescue team arrives, the hikers ___ in the cold for twelve hours.','will have been waiting','have been waiting','had been waiting','are waiting','by the time + 현재동사(arrives) + for → 미래완료진행.'],
// ── 가정법 ──
['cond','If I were the CEO, I ___ a four-day workweek.','would introduce','will introduce','would have introduced','introduce','If + 과거(were) → would + 동사원형 (가정법 과거).'],
['cond','If Sarah had left home earlier, she ___ the train.','would have caught','would catch','will catch','had caught','If + had p.p. → would have p.p. (가정법 과거완료).'],
['cond','Had the government acted sooner, the flood damage ___ much smaller.','would have been','would be','will be','has been','Had + S + p.p. = If S had p.p. (도치) → would have p.p.'],
['cond','If humans could breathe underwater, they ___ the ocean floor freely.','would explore','would have explored','will explore','explore','If + 과거(could) → would + 동사원형.'],
['cond','Were I in your position, I ___ the job offer immediately.','would accept','would have accepted','will accept','accepted','Were I = If I were (도치) → would + 동사원형.'],
['cond','If the team had practiced harder, it ___ the championship last year.','would have won','would win','will win','wins','If had p.p. → would have p.p.'],
['cond','If Mark knew the answer, he ___ it to us right now.','would tell','would have told','will tell','tells','If + 과거(knew) → would + 동사원형.'],
['cond','If the museum had not received the donation, it ___ its doors in 2015.','would have closed','would close','will close','closed','If had not p.p. → would have p.p.'],
['cond','If I had a time machine, I ___ to ancient Egypt.','would travel','would have traveled','will travel','travel','If + 과거(had) → would + 동사원형.'],
['cond','Linda would not have missed the meeting if her alarm ___.','had gone off','went off','would go off','goes off','주절이 would have p.p. → if절은 had p.p.'],
['cond','If dinosaurs still existed, zoos ___ very different places.','would be','would have been','will be','are','If + 과거(existed) → would + 동사원형.'],
['cond','Had Edison given up after his failures, we ___ electric light so early.','would not have had','would not have','will not have','did not have','Had S p.p. (도치) → would have p.p.'],
['cond','If Jenny spoke Spanish, she ___ as a tour guide in Madrid.','could work','could have worked','can work','works','If + 과거 → could/would + 동사원형.'],
['cond','If the company had invested in online sales, it ___ during the pandemic.','would have survived','would survive','will survive','survives','If had p.p. → would have p.p.'],
// ── 당위성 ──
['subj','The doctor recommended that Mr. Park ___ less salt.','eat','eats','ate','is eating','recommend that S + 동사원형 (should 생략).'],
['subj','It is essential that every employee ___ the safety training.','complete','completes','completed','will complete','It is essential that S + 동사원형.'],
['subj','The manager insisted that the report ___ by Friday.','be submitted','is submitted','was submitted','will be submitted','insist that S + 동사원형 → 수동이면 be p.p.'],
['subj','My parents suggested that I ___ a gap year before college.','take','took','takes','am taking','suggest that S + 동사원형.'],
['subj','It is important that she ___ her passport before the trip.','renew','renews','renewed','has renewed','It is important that S + 동사원형.'],
['subj','The law requires that drivers ___ a seat belt at all times.','wear','wears','wore','are wearing','require that S + 동사원형.'],
['subj','The teacher asked that the students ___ off their phones during the test.','turn','turned','turns','will turn','ask that S + 동사원형.'],
['subj','It is vital that the patient ___ in bed for a week.','stay','stays','stayed','will stay','It is vital that S + 동사원형.'],
['subj','The committee proposed that the festival ___ to May.','be moved','is moved','was moved','has been moved','propose that S + be p.p.'],
['subj','It is crucial that he ___ his medicine on time.','take','takes','took','is taking','It is crucial that S + 동사원형.'],
['subj','The coach urged that each player ___ enough sleep before the match.','get','gets','got','has gotten','urge that S + 동사원형.'],
['subj','It is necessary that the contract ___ by both parties.','be signed','is signed','was signed','will be signed','It is necessary that S + be p.p.'],
// ── 준동사 ──
['verbal','Many people enjoy ___ to music while they jog.','listening','to listen','to have listened','having listened','enjoy + -ing. 완료형(having p.p.)은 오답.'],
['verbal','Emma decided ___ abroad after graduation.','to study','studying','to have studied','having studied','decide + to V.'],
['verbal','You should avoid ___ heavy meals before bed.','eating','to eat','having eaten','to have eaten','avoid + -ing.'],
['verbal','The company plans ___ three new stores next year.','to open','opening','having opened','to have opened','plan + to V.'],
['verbal','Would you mind ___ the window?','closing','to close','having closed','to have closed','mind + -ing.'],
['verbal','Jason refused ___ the contract without reading it.','to sign','signing','having signed','to have signed','refuse + to V.'],
['verbal','The trainer recommends ___ for at least ten minutes before running.','stretching','to stretch','having stretched','to have stretched','recommend + -ing (목적어 없이 바로 올 때).'],
['verbal','Sophie hopes ___ a famous chef someday.','to become','becoming','having become','to have become','hope + to V.'],
['verbal','Have you considered ___ to a smaller apartment?','moving','to move','having moved','to have moved','consider + -ing.'],
['verbal','The students agreed ___ the classroom after the party.','to clean','cleaning','having cleaned','to have cleaned','agree + to V.'],
['verbal','He kept ___ the same mistake again and again.','making','to make','having made','to have made','keep + -ing.'],
['verbal','The doctor told me to quit ___ for my health.','smoking','to smoke','having smoked','to have smoked','quit + -ing.'],
['verbal','To save money, Liam chose ___ his bike to work.','to ride','riding','having ridden','to have ridden','choose + to V.'],
['verbal','The new job involves ___ to other countries often.','traveling','to travel','having traveled','to have traveled','involve + -ing.'],
['verbal','Nina went to the library ___ some books for her report.','to borrow','borrowing','having borrowed','to have borrowed','"~하기 위해" 목적 → to V.'],
['verbal','The museum postponed ___ the exhibit due to the storm.','opening','to open','having opened','to have opened','postpone + -ing.'],
['verbal','Ken promised ___ his sister with her homework.','to help','helping','having helped','to have helped','promise + to V.'],
['verbal','The suspect denied ___ the money from the store.','stealing','to steal','having to steal','to have stolen','deny + -ing.'],
['verbal','We can\'t afford ___ a new car this year.','to buy','buying','having bought','to have bought','afford + to V.'],
['verbal','Daniel finished ___ his report just before the deadline.','writing','to write','having written','to have written','finish + -ing.'],
['verbal','The team expects ___ the results by Friday.','to receive','receiving','having received','to have received','expect + to V.'],
['verbal','Some people dislike ___ in crowded places.','waiting','to have waited','having waited','to waiting','dislike + -ing.'],
// ── 조동사 ──
['modal','You ___ show your ID card to enter the building. It is a strict rule.','must','might','could','would','규칙·의무 → must.'],
['modal','Take an umbrella with you. It ___ rain later this afternoon.','may','must','would','shall','불확실한 추측(~할지도 모른다) → may.'],
['modal','Penguins are birds, but they ___ fly.','cannot','must not','should not','will not','능력이 없음 → cannot.'],
['modal','You look exhausted. You ___ get some rest.','should','can','may','would','충고(~하는 게 좋겠다) → should.'],
['modal','When I was a child, I ___ swim across the lake easily.','could','should','must','may','과거의 능력 → could.'],
['modal','If you practice every day, you ___ improve your score quickly.','will','must','should have','might have','조건 → 미래 결과 will.'],
['modal','Smartphones ___ distract students, so many schools limit their use.','can','must','shall','should have','일반적 가능성(~할 수 있다) → can.'],
['modal','The museum is free, so visitors ___ enter without paying a fee.','can','must','should','would','허가·가능 → can.'],
// ── 관계사 ──
['rel','The Eiffel Tower, ___, attracts millions of visitors every year.','which was completed in 1889','that was completed in 1889','who was completed in 1889','where was completed in 1889','사물 + 콤마 → which. 콤마 뒤 that은 불가.'],

Unlike most amphibians, the axolotl does not undergo metamorphosis. While a frog changes from a tadpole into an adult that can live on land, the axolotl keeps its youthful features throughout its life. It stays in the water and breathes through the feathery gills on the sides of its head. This trait, called neoteny, gives the animal its distinctive and friendly appearance.

The axolotl is famous for its remarkable ability to regenerate. It can regrow not only lost limbs and tails but also parts of vital organs, including its heart, spinal cord, and even sections of its brain. Because of this, scientists study the axolotl closely in the hope of learning how to help humans heal from injuries.

Although axolotls are common as pets and in laboratories, they are critically endangered in the wild. Their natural habitat has shrunk as Mexico City has expanded, and water pollution has worsened. In addition, non-native fish introduced into the lakes eat young axolotls and compete with them for food.

/* 14주 로드맵 (2026.11.23 ~ 2027.02.28) */
const PHASES = [
  { from:'2026-11-23', to:'2026-12-13', name:'1단계 · 문법 공식 완성', goal:'문법 26문항 중 22개 이상', todo:['시제·가정법·당위성 공식을 외운다','준동사 동사 목록 매일 퀴즈','단어 하루 30개 시작'] },
  { from:'2026-12-14', to:'2027-01-10', name:'2단계 · 독해·어휘 끌어올리기', goal:'문법 24개 + 독해 15개 이상', todo:['독해는 질문 먼저 읽고 키워드 찾기','어휘 문제는 "문맥상 뜻"으로 고르기','12월 말~1월 초 첫 시험 응시 (실전 감 잡기)'] },

  { from:'2027-02-01', to:'2027-02-28', name:'4단계 · 약점 보완 + 마지막 응시', goal:'65점 이상 성적표 확보', todo:['오답노트 반복','약한 문법 유형 집중','남은 시험 회차 응시, 성적 발표일 확인'] },
];

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = ['a','b','c','d'];

/* ── 저장 ── */
const KEY = 'gtelp65-v1';
const blank = () => ({ target:'2027-02-28', days:{}, streak:{last:'',n:0}, wrong:{}, stats:{}, vocab:{}, best:{}, mocks:[] });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dkey(new Date());
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const T = () => (S.days[today()] = S.days[today()] || { g:0, v:0, r:0, l:0, w:0 });
function bump(field, n){
  T()[field] += (n || 1);
  const t = today();
  if (S.streak.last !== t) {
    S.streak.n = (S.streak.last && dayNum(t) - dayNum(S.streak.last) === 1) ? S.streak.n + 1 : 1;
    S.streak.last = t;
  }
  save();
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }

/* 점수: 영역 점수 = 맞힌 수 / 문항 수 × 100, 총점 = 세 영역 평균 */
const sec = (c, n) => Math.round(c / n * 100);
const total = (g, l, r) => Math.round((g / 26 + l / 26 + r / 28) * 100 / 3);

/* ── 문법 문제 ── */
const GQ = GRAMMAR.map((g, i) => ({ id:'g' + i, t:g[0], q:g[1], a:g[2], w:[g[3], g[4], g[5]], e:g[6] }));
function grammarSet(mode){
  if (mode === 'real') { // 실전 26문항: 시험 유형 비율대로
    let set = [];
    for (const t in TYPES) set = set.concat(shuffle(GQ.filter(q => q.t === t)).slice(0, TYPES[t].n));
    while (set.length < 26) set.push(shuffle(GQ.filter(q => !set.includes(q)))[0]);
    return shuffle(set);
  }
  if (mode === 'wrong') return shuffle(GQ.filter(q => S.wrong[q.id]));
  if (mode === 'mix') return shuffle(GQ).slice(0, 20);
  return shuffle(GQ.filter(q => q.t === mode));
}
function verbSet(){
  const g = GERUND_VERBS.map(v => ({ id:'vg-' + v, verb:v, a:'-ing (동명사)', w:['to V (to부정사)'] }));
  const f = INF_VERBS.map(v => ({ id:'vi-' + v, verb:v, a:'to V (to부정사)', w:['-ing (동명사)'] }));
  return shuffle(g.concat(f)).slice(0, 20).map(x => ({ id:x.id, t:'verbal', q:'<b>' + x.verb + '</b> ___ (뒤에 오는 형태는?)', raw:true, a:x.a, w:x.w,
    e: x.a[0] === '-' ? x.verb + ' + -ing. 동명사만 오는 동사.' : x.verb + ' + to V. to부정사만 오는 동사.' }));
}

/* ── 공통 퀴즈 러너 ── */
let quiz = null;
function startQuiz(opts){
  quiz = Object.assign({ i:0, right:0, picked:null, results:[] }, opts);
  quiz.items = quiz.items.map(it => Object.assign({}, it, { order: shuffle([it.a].concat(it.w)) }));
  if (quiz.timer) quiz.t0 = Date.now();
  if (location.hash !== '#quiz') location.hash = 'quiz'; else render();
}
function qText(it){
  if (it.raw) return it.q;
  return esc(it.q).replace('___', '<span class="blank">&nbsp;</span>');
}
function viewQuiz(){
  if (!quiz) { location.hash = 'grammar'; return ''; }
  const it = quiz.items[quiz.i];
  if (!it) return viewQuizDone();
  const done = quiz.picked !== null;
  const el = quiz.timer ? Math.floor((Date.now() - quiz.t0) / 1000) : 0;
  let h = `<div class="row between"><span class="label">${esc(quiz.title)}</span>
    <span class="num muted">${quiz.i + 1} / ${quiz.items.length}${quiz.timer ? ' · <span id="clock">' + Math.floor(el/60) + ':' + pad(el%60) + '</span>' : ''}</span></div>
    <div class="bar"><i style="width:${quiz.i / quiz.items.length * 100}%"></i></div>
    <section class="sheet">`;
  if (TYPES[it.t] && !quiz.hideType) h += `<span class="label">${TYPES[it.t].name}</span>`;
  h += `<p class="q">${qText(it)}</p><div class="opts">`;
  it.order.forEach((o, k) => {
    let cls = 'opt';
    if (done) { if (o === it.a) cls += ' right'; else if (k === quiz.picked) cls += ' wrong'; }
    h += `<button class="${cls}" data-pick="${k}" ${done ? 'disabled' : ''}><span class="bub">${LET[k]}</span><span>${esc(o)}</span></button>`;
  });
  h += `</div>`;
  if (done) {
    const ok = it.order[quiz.picked] === it.a;
    h += `<p class="verdict ${ok ? 'ok' : 'no'}">${ok ? '정답' : '오답 · 정답은 (' + LET[it.order.indexOf(it.a)] + ')'}</p>
      ${it.e ? `<p class="explain">${esc(it.e)}</p>` : ''}
      <button class="btn primary" data-act="next">${quiz.i + 1 < quiz.items.length ? '다음 문제' : '결과 보기'}</button>`;
  }
  return h + `</section><button class="btn small" data-act="quit" style="align-self:flex-start">그만하기</button>`;
}
function pick(k){
  const it = quiz.items[quiz.i];
  if (quiz.picked !== null) return;
  quiz.picked = k;
  const ok = it.order[k] === it.a;
  if (ok) quiz.right++;
  quiz.results.push({ it, ok });
  if (quiz.kind === 'grammar') {
    const st = S.stats[it.t] = S.stats[it.t] || { c:0, n:0 };
    st.n++; if (ok) st.c++;
    if (!it.id.startsWith('v')) {
      if (!ok) S.wrong[it.id] = 2;               // 두 번 맞혀야 오답노트에서 빠짐
      else if (S.wrong[it.id]) { S.wrong[it.id]--; if (!S.wrong[it.id]) delete S.wrong[it.id]; bump('w'); }
    }
    bump('g');
  } else if (quiz.kind === 'syn') bump('v');
  else save();
  render();
}
function viewQuizDone(){
  const n = quiz.items.length, c = quiz.right;
  let h = `<section class="sheet"><span class="label">${esc(quiz.title)} 결과</span>
    <div class="row" style="align-items:baseline;gap:12px"><span class="score-big num">${c}/${n}</span><span class="muted">정답률 ${sec(c, n)}%</span></div>`;
  if (quiz.kind === 'grammar' && quiz.mode === 'real') {
    const m = Math.floor((Date.now() - quiz.t0) / 60000);
    h += `<p>문법 영역 예상 점수 <b class="num">${sec(c, 26)}점</b> · 걸린 시간 <b class="num">${m}분</b>. 목표는 24개 이상(92점), 20분 안.</p>`;
  }
  const miss = quiz.results.filter(r => !r.ok);
  if (miss.length) {
    h += `<h3>틀린 문제</h3><div class="scroll"><table><tr><th>문제</th><th>정답</th></tr>`;
    miss.forEach(r => h += `<tr><td>${r.it.raw ? r.it.q : esc(r.it.q)}</td><td><b>${esc(r.it.a)}</b></td></tr>`);
    h += `</table></div>`;
  }
  return h + `<div class="row"><button class="btn primary" data-act="again">다시 풀기</button><button class="btn" data-act="quit">끝내기</button></div></section>`;
}

/* ── 홈 ── */
function curPhase(){ const t = today(); return PHASES.find(p => t >= p.from && t <= p.to) || (t < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length - 1]); }
function viewHome(){
  const t = today(), left = dayNum(S.target) - dayNum(t);
  const span = dayNum(S.target) - dayNum('2026-11-19');
  const prog = Math.min(100, Math.max(0, (1 - left / span) * 100));
  const d = T(), ph = curPhase();
  const wrongN = Object.keys(S.wrong).length;
  const ms = [
    ['문법 20문제', d.g, 20, '#grammar'],
    ['단어 30개', d.v, 30, '#vocab'],
    ['독해 또는 청취 1세트', d.r + d.l, 1, '#reading'],
    ['오답 다시 풀기', wrongN ? d.w : 1, wrongN ? Math.min(5, wrongN) : 1, '#grammar'],
  ];
  const doneN = ms.filter(m => m[1] >= m[2]).length;
  let weak = null;
  for (const k in S.stats) { const s = S.stats[k]; if (s.n >= 5) { const r = s.c / s.n; if (!weak || r < weak.r) weak = { k, r }; } }
  let h = `<header class="dday">
      <span class="big num">D-${Math.max(0, left)}</span>
      <span class="t">지텔프 Level 2 · 65점 마감 ${S.target.replace(/-/g, '.')}</span>
      <div><div class="bar"><i style="width:${prog}%"></i></div><span class="label">기간 ${Math.round(prog)}% 지남 · 연속 ${S.streak.n}일째 공부</span></div>
    </header>
    <section class="sheet">
      <div class="row between"><h2>오늘의 미션</h2><span class="num muted">${doneN}/4</span></div>
      ${ms.map(m => `<div class="mission"><span class="dot ${m[1] >= m[2] ? 'on' : ''}" aria-label="${m[1] >= m[2] ? '완료' : '미완료'}"></span>
        <span>${m[0]} <span class="num muted">${Math.min(m[1], m[2])}/${m[2]}</span></span><a class="btn small go" href="${m[3]}">하기</a></div>`).join('')}
    </section>
    <section class="sheet">
      <span class="label">지금 단계 · ${ph.from.slice(5).replace('-', '/')} ~ ${ph.to.slice(5).replace('-', '/')}</span>
      <h2>${ph.name}</h2>
      <p>목표: <b>${ph.goal}</b></p>
      <ul style="margin:0;padding-left:20px">${ph.todo.map(x => `<li>${x}</li>`).join('')}</ul>
      ${weak ? `<p class="explain">가장 약한 유형: <b>${TYPES[weak.k].name}</b> (정답률 ${Math.round(weak.r * 100)}%) · <a href="#grammar" data-type="${weak.k}">집중 연습</a></p>` : ''}
    </section>
    <section class="sheet">
      <h2>65점 작전</h2>
      <p>총점은 세 영역 점수의 <b>평균</b>이에요. 문법은 공식대로 나와서 90점대가 가능하니 문법으로 점수를 벌고, 청취는 40점대여도 됩니다.</p>
      <div class="scroll"><table>
        <tr><th>영역</th><th>문항</th><th>목표 정답</th><th>점수</th></tr>
        <tr><td>문법</td><td class="num">26</td><td class="num">24</td><td class="num">92</td></tr>
        <tr><td>독해·어휘</td><td class="num">28</td><td class="num">17</td><td class="num">61</td></tr>
        <tr><td>청취</td><td class="num">26</td><td class="num">11</td><td class="num">42</td></tr>
        <tr><th>평균</th><th></th><th></th><th class="num pass">${total(24, 11, 17)}</th></tr>
      </table></div>
      <p class="muted">2월 마지막 시험 한 번에 걸지 말고, 1월부터 매 회차 응시하세요. 성적 발표까지 시간이 걸리니 2월 초까지 65점을 받아 두는 게 안전합니다.</p>
    </section>`;
  return h;
}

/* ── 문법 ── */
function viewGrammar(){
  const wrongN = Object.keys(S.wrong).length;
  let h = `<h1 style="font-family:var(--display);font-weight:400;font-size:28px">문법 <span class="muted" style="font-size:16px;font-family:var(--body)">26문항 · 점수 버는 영역</span></h1>
    <section class="sheet"><h2>실전·복습</h2>
      <div class="row">
        <button class="btn primary" data-g="real">실전 26문항 (시간 재기)</button>
        <button class="btn" data-g="mix">랜덤 20문제</button>
        <button class="btn" data-g="wrong" ${wrongN ? '' : 'disabled'}>오답노트 ${wrongN}개</button>
        <button class="btn" data-g="verbs">-ing / to V 동사 퀴즈</button>
      </div>
      <p class="muted">오답노트 문제는 두 번 맞혀야 빠집니다.</p>
    </section>
    <section class="sheet"><h2>유형별 공식</h2><p class="muted">유형을 누르면 그 유형만 풀어요. 시험에 나오는 대략의 문항 수도 적어 두었어요.</p>
      <div class="formula">`;
  for (const k in TYPES) {
    const st = S.stats[k], cnt = GQ.filter(q => q.t === k).length;
    h += `<button class="ftile" data-g="${k}"><span class="row between"><b>${TYPES[k].name}</b><span class="num muted" style="font-size:12px">시험 약 ${TYPES[k].n}개</span></span>
      <small>${esc(TYPES[k].tip)}</small>
      <span class="num muted" style="font-size:12px">${cnt}문제${st ? ' · 정답률 ' + Math.round(st.c / st.n * 100) + '%' : ''}</span></button>`;
  }
  h += `</div></section>
    <section class="sheet"><h2>시제 단서 표</h2><div class="scroll"><table>
      <tr><th>단서</th><th>정답 형태</th></tr>
      <tr><td>now, right now, at the moment, currently, these days</td><td>is/are -ing</td></tr>

function chart(){

  const W = 320, H = 150, L = 30, R = 10, Tp = 10, B = 24;
  const x = i => ms.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (ms.length - 1);

  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--omr)" stroke-width="2"/>`;
  ms.forEach((m, i) => s += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i === ms.length - 1 ? 5 : 3.5}" fill="${m.t >= 65 ? 'var(--ok)' : 'var(--omr)'}"/><text x="${pts[i][0]}" y="${H - 6}" text-anchor="middle">${m.d.slice(5).replace('-', '/')}</text>`);
  s += `</svg></div><div class="scroll"><table><tr><th>날짜</th><th>문법</th><th>독해</th><th>청취</th><th>평균</th><th></th></tr>`;

  return s + `</table></div>`;
}

  if (d.act === 'quit') { const back = quiz && quiz.kind === 'syn' ? 'vocab' : 'grammar'; quiz = null; location.hash = back; return; }
  if (d.act === 'vstart') { const q = vocabQueue(); if (!q.length) return toast('오늘 볼 카드가 없어요. 내일 다시!'); vs = { q, i:0, flip:false }; return render(); }
  if (d.act === 'flip') { vs.flip = !vs.flip; return render(); }
  if (d.know !== undefined) {
    const v = vs.q[vs.i], cur = S.vocab[v.w] || { b:0, d:0 };
    cur.b = d.know === '1' ? Math.min(5, cur.b + 1) : 0;
    cur.d = dayNum(today()) + (d.know === '1' ? GAP[cur.b] : 0);
    if (d.know === '0') vs.q.push(v);           // 모르면 오늘 한 번 더
    S.vocab[v.w] = cur; bump('v'); vs.i++; vs.flip = false; return render();
  }
  if (d.act === 'vquit') { vs = null; return render(); }
  if (d.act === 'syn') return startQuiz({ kind:'syn', title:'동의어 퀴즈', items:synSet(), hideType:true });
  if (d.read) { const p = READING.find(x => x.id === d.read); rd = { id:p.id, ans:{}, right:0, order:p.q.map(q => shuffle(q.slice(1, 5))) }; render(); window.scrollTo(0, 0); return; }
  if (d.rq !== undefined) {
    const p = READING.find(x => x.id === rd.id), i = +d.rq, k = +d.k;
    rd.ans[i] = k; if (rd.order[i][k] === p.q[i][1]) rd.right++;
    if (Object.keys(rd.ans).length === p.q.length) { S.best[p.id] = Math.max(S.best[p.id] || 0, rd.right); bump('r'); }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (d.act === 'rback') { rd = null; return render(); }
  if (d.listen) { const s = LISTENING.find(x => x.id === d.listen); ls = { id:s.id, ans:{}, right:0, rate: ls ? ls.rate : 0.9, showQ:false, order:s.q.map(q => shuffle(q.slice(1, 5))) }; if (synth) synth.cancel(); render(); window.scrollTo(0, 0); return; }
  if (d.act === 'play') return playSet();
  if (d.act === 'stop') { if (synth) synth.cancel(); return; }
  if (d.act === 'qtoggle') { ls.showQ = !ls.showQ; return render(); }
  if (d.lq !== undefined) {
    const s = LISTENING.find(x => x.id === ls.id), i = +d.lq, k = +d.k;
    ls.ans[i] = k; if (ls.order[i][k] === s.q[i][1]) ls.right++;
    if (Object.keys(ls.ans).length === s.q.length) { S.best[s.id] = Math.max(S.best[s.id] || 0, ls.right); bump('l'); if (synth) synth.cancel(); }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (d.act === 'lback') { if (synth) synth.cancel(); ls = null; return render(); }
  if (d.del) { const [dd, tt] = d.del.split('|'); const i = S.mocks.findIndex(m => m.d === dd && String(m.t) === tt); if (i > -1) S.mocks.splice(i, 1); save(); return render(); }
  if (d.act === 'reset') { if (!resetArm) { resetArm = true; return render(); } resetArm = false; S = blank(); save(); toast('기록을 지웠어요'); return render(); }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sim) { sim[t.dataset.sim] = +t.value; const y = window.scrollY; render(); window.scrollTo(0, y); const n = document.getElementById(t.id); if (n) n.focus(); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'target' && t.value) { S.target = t.value; save(); toast('마감일을 바꿨어요'); }
  if (t.id === 'rate') ls.rate = +t.value;
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => Math.max(0, Math.min(100, +document.getElementById(id).value));
  const m = { d: document.getElementById('m-d').value, g: v('m-g'), r: v('m-r'), l: v('m-l') };
  m.t = Math.round((m.g + m.r + m.l) / 3);
  S.mocks.push(m); save(); toast(m.t >= 65 ? m.t + '점! 목표 달성' : '평균 ' + m.t + '점 기록'); render();
});
if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => {};
render();
})();
</script>
