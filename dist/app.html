<style>
/* Layout: OMR 답안지 — 빨간 인쇄선, 칠하는 동그라미 보기. 넓은 화면에선 여러 단으로 펼쳐 한눈에 */
:root{
  --paper:#fbfaf7; --sheet:#ffffff; --ink:#1d1f24; --muted:#6b6862;
  --omr:#d2394a; --omr-soft:#fbe3e5; --line:#ecc9cd;
  --ok:#1f8a5b; --ok-soft:#dff3e9; --bad:#c2410c; --bad-soft:#fde8dc;
  --display:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16171b; --sheet:#1f2126; --ink:#ecebe8; --muted:#a19d96;
  --omr:#ff6b78; --omr-soft:#3a2226; --line:#4a3236;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171b; --sheet:#1f2126; --ink:#ecebe8; --muted:#a19d96;
  --omr:#ff6b78; --omr-soft:#3a2226; --line:#4a3236;
  --ok:#4fd39a; --ok-soft:#173327; --bad:#ff9a6b; --bad-soft:#3a2418; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-family:var(--display);font-weight:400;font-size:26px}
h2{font-size:17px} h3{font-size:15px}
p{margin:0} ul,ol{margin:0;padding-left:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:7px 14px;font-weight:500}
a.btn{color:var(--ink);text-decoration:none}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.small{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--omr);color:#fff;border-color:var(--omr)}
.bar{height:7px;background:var(--omr-soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--omr)}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.explain{border-left:3px solid var(--omr);padding:5px 10px;background:var(--omr-soft);border-radius:0 6px 6px 0;font-size:13.5px}

/* 상단 D-day */
.dday{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:center;border-bottom:2px solid var(--omr);padding-bottom:12px}
.dday .big{font-family:var(--display);font-size:52px;line-height:1;color:var(--omr);grid-row:span 2}
.dday .t{font-weight:700;font-size:16px}

/* 7일 플랜 */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.day.now{border:2px solid var(--omr)}
.day.done{opacity:.6}
.day .dn{font-family:var(--display);font-size:22px;color:var(--omr);line-height:1}
.day table td{font-size:13px;padding:3px 2px}
.day table td:first-child{white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:12px;width:52px}

/* 문제지 */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--line)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px;align-items:start}
.item{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item.ok{border-color:var(--ok)} .item.no{border-color:var(--bad)}
.q{font-size:15px;line-height:1.6}
.q .n{font-family:var(--mono);font-weight:700;color:var(--omr);margin-right:4px}
.q .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--ink);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:40px;font-size:14px}
.bub{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.opt.picked .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}

/* 독해 */
.read{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media (min-width:900px){.read{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.read .passage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 110px)}}
.passage{white-space:pre-wrap;font-size:15px;line-height:1.75;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sheet);max-height:60vh}
.passage h3{white-space:normal;margin-bottom:6px}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.vt td.m{cursor:pointer}
.vt .hidden-m{color:transparent;background:var(--omr-soft);border-radius:4px;user-select:none}
.vt tr.known td{color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--omr);background:var(--sheet);padding:0}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.stat{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--omr)}
input[type=date],input[type=number],select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;flex:1 1 90px;min-width:0}
.score-big{font-family:var(--display);font-size:40px;line-height:1}
.note h2{color:var(--omr);font-family:var(--display);font-weight:400;font-size:19px}
.note b{font-weight:700}
.kbd{font-family:var(--mono);font-size:13px;background:var(--omr-soft);border-radius:4px;padding:0 4px}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:2px solid var(--omr);display:grid;grid-template-columns:repeat(7,1fr);
  padding:5px max(4px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--muted);font-size:11.5px;padding:3px 0;gap:1px}
nav.tabs a .ic{font-family:var(--display);font-size:17px;line-height:1.2}
nav.tabs a[aria-current="page"]{color:var(--omr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:7px 15px;border-radius:999px;font-size:14px;z-index:6}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
</style>

<script>
/* G-TELP Level 2 study data. 모든 문제·지문은 이 앱용으로 직접 쓴 연습 문항입니다.
   문법: [유형, 문장, 정답, 오답1, 오답2, 오답3, 해설]  (보기는 화면에서 섞음) */
const TYPES = {
  tense:  { name: '시제', n: 6, tip: '진행형이 정답. 단서 부사구로 6가지 진행형 중 고른다.' },
  cond:   { name: '가정법', n: 6, tip: 'If 과거 → would+동사원형 / If had p.p. → would have p.p. / 도치 Were·Had' },
  verbal: { name: '준동사', n: 6, tip: '동사 뒤 -ing냐 to V냐. having p.p.·to have p.p.는 거의 오답.' },
  subj:   { name: '당위성', n: 2, tip: 'suggest·recommend·important 등 + that S + 동사원형' },
  modal:  { name: '조동사', n: 2, tip: '문장 해석: 의무 must / 충고 should / 능력 can / 추측 may' },
  rel:    { name: '관계사', n: 2, tip: '콤마 뒤 that 불가. 사람 who, 사물 which, 장소 where, 소유 whose' },
  conj:   { name: '연결어', n: 2, tip: '앞뒤 문장 관계: 역접 However / 결과 Therefore / 추가 Moreover / 아니면 Otherwise' },
};

const GRAMMAR = [
// ── 시제 ──
['tense','Right now, Mia ___ for her final exam in the library.','is studying','studies','has studied','will study','Right now(지금) → 현재진행 is -ing.'],
['tense','Kevin ___ at the bank for ten years by the time he retires next month.','will have been working','has been working','had been working','will work','by the time + 현재동사(retires) + for 기간 → 미래완료진행 will have been -ing.'],
['tense','The guests ___ for over an hour when the bride finally arrived.','had been waiting','have been waiting','were waiting','will have been waiting','과거 시점(arrived)보다 앞서 + for 기간 → 과거완료진행 had been -ing.'],
['tense','Since 2019, the city ___ new bike lanes across downtown.','has been building','had been building','is building','builds','Since + 과거시점 → 현재완료진행 has been -ing.'],
['tense','When the power went out last night, my family ___ a movie.','was watching','is watching','has been watching','watches','when + 과거동사(went out), last night → 과거진행 was -ing.'],
['tense','If you call me at 9 p.m. tomorrow, I ___ my presentation.','will be practicing','practice','am practicing','have been practicing','tomorrow, if/when + 현재동사 → 미래진행 will be -ing.'],
['tense','These days, more people ___ electric cars because of rising fuel prices.','are buying','bought','had bought','will have bought','These days(요즘) → 현재진행.'],
['tense','Jake ___ in the garden at the moment, so he can\'t answer the phone.','is working','works','worked','has worked','at the moment → 현재진행.'],
['tense','By next June, Dr. Lee ___ the disease for two decades.','will have been studying','has been studying','had been studying','is studying','By + 미래시점(next June) + for 기간 → 미래완료진행.'],
['tense','Before she moved to Seoul in 2020, Anna ___ English in Busan for five years.','had been teaching','has been teaching','was teaching','will have been teaching','과거(moved in 2020) 이전부터 + for 기간 → 과거완료진행.'],
['tense','Ever since he got the promotion, Tom ___ late every night.','has been working','had been working','works','will be working','ever since + 과거 → 현재완료진행.'],
['tense','While the chef ___ the sauce, a fire alarm suddenly went off.','was stirring','is stirring','has been stirring','stirs','while + 과거 사건(went off) → 과거진행.'],
['tense','Next Saturday, our team ___ in the national robotics competition.','will be competing','competes','has been competing','was competing','Next Saturday(미래 시점) → 미래진행.'],
['tense','Currently, scientists ___ a new vaccine against the virus.','are developing','developed','had developed','will have developed','Currently → 현재진행.'],
['tense','My brother ___ video games since he came home three hours ago.','has been playing','is playing','had been playing','will be playing','since + 과거 (지금까지 계속) → 현재완료진행.'],
['tense','By the time the rescue team arrives, the hikers ___ in the cold for twelve hours.','will have been waiting','have been waiting','had been waiting','are waiting','by the time + 현재동사(arrives) + for → 미래완료진행.'],
// ── 가정법 ──
['cond','If I were the CEO, I ___ a four-day workweek.','would introduce','will introduce','would have introduced','introduce','If + 과거(were) → would + 동사원형 (가정법 과거).'],
['cond','If Sarah had left home earlier, she ___ the train.','would have caught','would catch','will catch','had caught','If + had p.p. → would have p.p. (가정법 과거완료).'],
['cond','Had the government acted sooner, the flood damage ___ much smaller.','would have been','would be','will be','has been','Had + S + p.p. = If S had p.p. (도치) → would have p.p.'],
['cond','If humans could breathe underwater, they ___ the ocean floor freely.','would explore','would have explored','will explore','explore','If + 과거(could) → would + 동사원형.'],
['cond','Were I in your position, I ___ the job offer immediately.','would accept','would have accepted','will accept','accepted','Were I = If I were (도치) → would + 동사원형.'],
['cond','If the team had practiced harder, it ___ the championship last year.','would have won','would win','will win','wins','If had p.p. → would have p.p.'],
['cond','If Mark knew the answer, he ___ it to us right now.','would tell','would have told','will tell','tells','If + 과거(knew) → would + 동사원형.'],
['cond','If the museum had not received the donation, it ___ its doors in 2015.','would have closed','would close','will close','closed','If had not p.p. → would have p.p.'],
['cond','If I had a time machine, I ___ to ancient Egypt.','would travel','would have traveled','will travel','travel','If + 과거(had) → would + 동사원형.'],
['cond','Linda would not have missed the meeting if her alarm ___.','had gone off','went off','would go off','goes off','주절이 would have p.p. → if절은 had p.p.'],
['cond','If dinosaurs still existed, zoos ___ very different places.','would be','would have been','will be','are','If + 과거(existed) → would + 동사원형.'],
['cond','Had Edison given up after his failures, we ___ electric light so early.','would not have had','would not have','will not have','did not have','Had S p.p. (도치) → would have p.p.'],
['cond','If Jenny spoke Spanish, she ___ as a tour guide in Madrid.','could work','could have worked','can work','works','If + 과거 → could/would + 동사원형.'],
['cond','If the company had invested in online sales, it ___ during the pandemic.','would have survived','would survive','will survive','survives','If had p.p. → would have p.p.'],
// ── 당위성 ──
['subj','The doctor recommended that Mr. Park ___ less salt.','eat','eats','ate','is eating','recommend that S + 동사원형 (should 생략).'],
['subj','It is essential that every employee ___ the safety training.','complete','completes','completed','will complete','It is essential that S + 동사원형.'],
['subj','The manager insisted that the report ___ by Friday.','be submitted','is submitted','was submitted','will be submitted','insist that S + 동사원형 → 수동이면 be p.p.'],
['subj','My parents suggested that I ___ a gap year before college.','take','took','takes','am taking','suggest that S + 동사원형.'],
['subj','It is important that she ___ her passport before the trip.','renew','renews','renewed','has renewed','It is important that S + 동사원형.'],
['subj','The law requires that drivers ___ a seat belt at all times.','wear','wears','wore','are wearing','require that S + 동사원형.'],
['subj','The teacher asked that the students ___ off their phones during the test.','turn','turned','turns','will turn','ask that S + 동사원형.'],
['subj','It is vital that the patient ___ in bed for a week.','stay','stays','stayed','will stay','It is vital that S + 동사원형.'],
['subj','The committee proposed that the festival ___ to May.','be moved','is moved','was moved','has been moved','propose that S + be p.p.'],
['subj','It is crucial that he ___ his medicine on time.','take','takes','took','is taking','It is crucial that S + 동사원형.'],
['subj','The coach urged that each player ___ enough sleep before the match.','get','gets','got','has gotten','urge that S + 동사원형.'],
['subj','It is necessary that the contract ___ by both parties.','be signed','is signed','was signed','will be signed','It is necessary that S + be p.p.'],
// ── 준동사 ──
['verbal','Many people enjoy ___ to music while they jog.','listening','to listen','to have listened','having listened','enjoy + -ing. 완료형(having p.p.)은 오답.'],
['verbal','Emma decided ___ abroad after graduation.','to study','studying','to have studied','having studied','decide + to V.'],
['verbal','You should avoid ___ heavy meals before bed.','eating','to eat','having eaten','to have eaten','avoid + -ing.'],
['verbal','The company plans ___ three new stores next year.','to open','opening','having opened','to have opened','plan + to V.'],
['verbal','Would you mind ___ the window?','closing','to close','having closed','to have closed','mind + -ing.'],
['verbal','Jason refused ___ the contract without reading it.','to sign','signing','having signed','to have signed','refuse + to V.'],
['verbal','The trainer recommends ___ for at least ten minutes before running.','stretching','to stretch','having stretched','to have stretched','recommend + -ing (목적어 없이 바로 올 때).'],
['verbal','Sophie hopes ___ a famous chef someday.','to become','becoming','having become','to have become','hope + to V.'],
['verbal','Have you considered ___ to a smaller apartment?','moving','to move','having moved','to have moved','consider + -ing.'],
['verbal','The students agreed ___ the classroom after the party.','to clean','cleaning','having cleaned','to have cleaned','agree + to V.'],
['verbal','He kept ___ the same mistake again and again.','making','to make','having made','to have made','keep + -ing.'],
['verbal','The doctor told me to quit ___ for my health.','smoking','to smoke','having smoked','to have smoked','quit + -ing.'],
['verbal','To save money, Liam chose ___ his bike to work.','to ride','riding','having ridden','to have ridden','choose + to V.'],
['verbal','The new job involves ___ to other countries often.','traveling','to travel','having traveled','to have traveled','involve + -ing.'],
['verbal','Nina went to the library ___ some books for her report.','to borrow','borrowing','having borrowed','to have borrowed','"~하기 위해" 목적 → to V.'],
['verbal','The museum postponed ___ the exhibit due to the storm.','opening','to open','having opened','to have opened','postpone + -ing.'],
['verbal','Ken promised ___ his sister with her homework.','to help','helping','having helped','to have helped','promise + to V.'],
['verbal','The suspect denied ___ the money from the store.','stealing','to steal','having to steal','to have stolen','deny + -ing.'],
['verbal','We can\'t afford ___ a new car this year.','to buy','buying','having bought','to have bought','afford + to V.'],
['verbal','Daniel finished ___ his report just before the deadline.','writing','to write','having written','to have written','finish + -ing.'],
['verbal','The team expects ___ the results by Friday.','to receive','receiving','having received','to have received','expect + to V.'],
['verbal','Some people dislike ___ in crowded places.','waiting','to have waited','having waited','to waiting','dislike + -ing.'],

`Florence Nightingale was a British nurse and social reformer who is widely regarded as the founder of modern nursing. She is best known for her work during the Crimean War, where she earned the nickname "The Lady with the Lamp."

Nightingale was born on May 12, 1820, in Florence, Italy, to a wealthy British family, and she was named after the city of her birth. As a young woman, she believed she had received a calling to serve others. Her parents, however, strongly opposed her wish to become a nurse, as nursing was not considered a respectable profession for women of her class at the time. Despite their objections, she pursued her goal and received nursing training in Kaiserswerth, Germany, in 1850 and 1851.

In 1854, Nightingale led a team of 38 volunteer nurses to a British military hospital in Scutari, in present-day Turkey. She found the conditions there appalling: wounded soldiers lay in dirty wards without enough blankets, food, or clean water. Nightingale and her team improved sanitation, organized supplies, and cared for patients day and night. Her habit of checking on soldiers at night with a lamp in her hand made her famous.

After the war, Nightingale used statistics to persuade officials that poor hygiene, rather than battle wounds, had caused most soldiers' deaths. She presented her data in innovative diagrams that made the problem easy to grasp. In 1860, she established a nursing school at St Thomas' Hospital in London, which helped transform nursing into a respected career.

Nightingale died in 1910. Today, International Nurses Day is celebrated on her birthday to honor her lasting contributions.`,

`For many people, the most natural thing to do after a big meal is to sit on the couch. However, a growing body of research suggests that a short walk after eating may offer surprising health benefits.

When we eat, especially foods rich in carbohydrates, the level of sugar in our blood rises. Over time, frequent and sharp increases in blood sugar can raise the risk of health problems such as type 2 diabetes. Muscles, however, use sugar as fuel when they work. Studies have found that even light movement soon after a meal helps the body absorb sugar from the blood, making the rise smaller and shorter.

The good news is that the walk does not need to be long or intense. Researchers have reported benefits from walks as short as two to five minutes, as long as they take place soon after eating. A slow walk around the office or a few minutes of household chores may be enough to make a difference.

Experts say that walking after meals may also aid digestion and improve mood. Some people who adopt the habit say they sleep better when they walk after dinner rather than going straight to the sofa.

Of course, a short walk is not a substitute for a balanced diet or regular exercise. But for busy people who struggle to find time for the gym, it is a simple and practical place to start. So, the next time you finish a meal, consider standing up and taking a few steps.`,

{ id:'r3', part:'Part 3 · 백과사전', title:'AXOLOTL', body:
`The axolotl is a type of salamander native to the lakes and canals of the Mexico City area, particularly Lake Xochimilco. It is often called the "Mexican walking fish," although it is an amphibian, not a fish.

Unlike most amphibians, the axolotl does not undergo metamorphosis. While a frog changes from a tadpole into an adult that can live on land, the axolotl keeps its youthful features throughout its life. It stays in the water and breathes through the feathery gills on the sides of its head. This trait, called neoteny, gives the animal its distinctive and friendly appearance.

The axolotl is famous for its remarkable ability to regenerate. It can regrow not only lost limbs and tails but also parts of vital organs, including its heart, spinal cord, and even sections of its brain. Because of this, scientists study the axolotl closely in the hope of learning how to help humans heal from injuries.

Although axolotls are common as pets and in laboratories, they are critically endangered in the wild. Their natural habitat has shrunk as Mexico City has expanded, and water pollution has worsened. In addition, non-native fish introduced into the lakes eat young axolotls and compete with them for food.

Conservation groups are working with local farmers to restore clean waterways in Xochimilco. The axolotl has also become a cultural symbol in Mexico, appearing in art and even on a banknote, which has helped raise public awareness of its plight.`,

`Louis Braille was a French educator who invented braille, the system of raised dots that allows blind people to read and write by touch. His invention is still used around the world today, almost two centuries after he created it.

Braille was born on January 4, 1809, in Coupvray, a small town near Paris. His father made leather goods, and young Louis often played in his workshop. At the age of three, he accidentally injured his eye with a sharp tool. The wound became infected, and the infection soon spread to his other eye. By the age of five, he was completely blind.

Despite his disability, Braille was a bright and curious student. At ten, he won a scholarship to the Royal Institute for Blind Youth in Paris. The school's books used large raised letters, which were heavy, expensive, and very slow to read. When Braille was twelve, a former army captain named Charles Barbier visited the school and shared a code of raised dots that soldiers could read in the dark. The code was too complicated for everyday use, but it gave Braille an idea.

Working tirelessly, Braille simplified Barbier's system into a cell of just six dots, which could be felt with a single fingertip. He completed the basic system when he was only fifteen and later adapted it for mathematics and music. He went on to become a respected teacher at the institute.

Braille died of tuberculosis in 1852 at the age of 43. Two years later, the school officially adopted his system, and it gradually spread to other countries. Today, his name has become the word for the writing system itself.`,

{ id:'r6', part:'Part 2 · 잡지 기사', title:'THE SURPRISING BENEFITS OF BOREDOM', body:
`Most of us do everything we can to avoid boredom. The moment we have nothing to do, we reach for our phones to check messages, watch videos, or scroll through social media. However, some psychologists now argue that being bored from time to time may actually be good for us.

In one widely discussed experiment, participants were first asked to complete a dull task, such as copying numbers from a phone book. Afterward, they were asked to think of as many uses as possible for a pair of plastic cups. The bored participants came up with more creative ideas than those who had skipped the dull task.

Researchers believe this happens because boredom lets the mind wander. When we are not focused on anything in particular, the brain begins to make new connections between ideas. This daydreaming state can lead to fresh solutions to problems that we could not solve when we were concentrating hard.

Boredom may also push people to change their lives. The uncomfortable feeling acts as a signal that our current activity is not meaningful, motivating us to seek new goals or hobbies.

{ id:'r7', part:'Part 3 · 백과사전', title:'MONARCH BUTTERFLY', body:
`The monarch butterfly is a large orange-and-black butterfly found mainly in North America. It is famous for its long annual migration, one of the most remarkable journeys in the insect world.

Each autumn, monarchs in eastern North America fly south to the mountain forests of central Mexico, a trip of up to about 4,800 kilometers. There, millions of butterflies gather in fir trees to survive the winter. In spring, they begin flying north again. No single butterfly completes the whole round trip, however. The monarchs that fly south belong to a special generation that can live for up to eight months, while summer generations live for only a few weeks. It takes several generations to return to the northern breeding grounds.

Scientists believe monarchs use the position of the sun to find their direction, and they may also sense the Earth's magnetic field. Remarkably, the butterflies that arrive in Mexico have never made the trip before.

Monarch caterpillars feed only on milkweed plants. The milkweed contains toxins that remain in the butterfly's body, making it poisonous to many birds. Its bright colors serve as a warning to predators to stay away.

In recent decades, monarch populations have fallen sharply. The loss of milkweed due to farming and the use of chemicals, the clearing of forests in Mexico, and extreme weather linked to climate change all pose threats. Many communities now plant milkweed gardens to help the butterflies recover.`,

const shuffle = (a, r) => { r = r || Math.random; a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = ['a','b','c','d'];
const pad = n => String(n).padStart(2, '0');

/* ── 저장 ── */
const KEY = 'gtelp65-v1';
const blank = () => ({ target:'', start:'', done:{}, days:{}, wrong:{}, stats:{}, known:{}, best:{}, mocks:[], draft:null, hideM:true });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = blank(); }
if (S.vocab && !Object.keys(S.known).length) { for (const w in S.vocab) if (S.vocab[w].b >= 2) S.known[w] = 1; delete S.vocab; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dkey(new Date());
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromNum = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
if (!S.start) { S.start = today(); S.target = ''; }   // 1판(14주)에서 넘어오면 7일 기준으로 다시
if (!S.target) { S.target = fromNum(dayNum(S.start) + 7); }

const T = () => (S.days[today()] = S.days[today()] || { g:0, v:0, r:0, l:0 });
function bump(f, n){ T()[f] += (n || 1); save(); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1900); }
const sec = (c, n) => Math.round(c / n * 100);

/* ── 문제 만들기 ── */
const GQ = GRAMMAR.map((g, i) => ({ id:'g' + i, t:g[0], q:g[1], a:g[2], w:[g[3], g[4], g[5]], e:g[6] }));
const typeKeys = Object.keys(TYPES);
function withOrder(items, r){ return items.map(it => Object.assign({}, it, { order: shuffle([it.a].concat(it.w), r) })); }
function realGrammar(r){ // 시험 비율대로 26문항
  let set = [];
  typeKeys.forEach(t => set = set.concat(shuffle(GQ.filter(q => q.t === t), r).slice(0, TYPES[t].n)));
  return shuffle(set, r);
}
function mockGrammar(n){ // 모의고사 회차별로 겹치지 않게
  const r = rng(2027); let set = [];
  typeKeys.forEach(t => { const pool = shuffle(GQ.filter(q => q.t === t), r); set = set.concat(pool.slice((n - 1) * TYPES[t].n, n * TYPES[t].n)); });
  return withOrder(shuffle(set, rng(n * 31)), rng(n * 97));
}
const OBJ_TO = 'advise allow encourage require ask urge enable cause force persuade permit expect want'.split(' ');
function verbItems(){
  const g = GERUND_VERBS.map(v => ({ id:'vg-' + v, q:'<b>' + v + '</b> ___', raw:true, a:'-ing', w:['to V'], e:v + ' + -ing' }));
  const f = INF_VERBS.map(v => ({ id:'vi-' + v, q:'<b>' + v + '</b> ___', raw:true, a:'to V', w:['-ing'], e:v + ' + to V' }));
  const o = OBJ_TO.map(v => ({ id:'vo-' + v, q:'<b>' + v + '</b> him ___', raw:true, a:'to V', w:['-ing','동사원형'], e:v + ' + 목적어 + to V' }));
  const c = ['make','let','have'].map(v => ({ id:'vc-' + v, q:'<b>' + v + '</b> him ___', raw:true, a:'동사원형', w:['to V','-ing'], e:'사역동사 ' + v + ' + 목적어 + 동사원형' }));
  return shuffle(g.concat(f, o, c));
}
function synItems(n){
  return shuffle(VOCAB).slice(0, n).map(v => {
    const ans = v.s.split(', ')[0];
    const others = shuffle(VOCAB.filter(x => x !== v && !x.s.includes(ans) && !v.s.includes(x.s.split(', ')[0]))).slice(0, 3).map(x => x.s.split(', ')[0]);
    return { id:'s-' + v.w, q:'<b>' + esc(v.w) + '</b> ≈ ?', raw:true, a:ans, w:others, e:v.w + ' = ' + v.m + ' ≈ ' + v.s };
  });
}
function rItems(p, r){ return withOrder(p.q.map((q, i) => ({ id:p.id + '-' + i, q:q[0], a:q[1], w:q.slice(2, 5), e:q[5] })), r); }
function lItems(s, r){ return withOrder(s.q.map((q, i) => ({ id:s.id + '-' + i, q:q[0], a:q[1], w:q.slice(2, 5) })), r); }

/* ── 문제지(시트): 여러 문제를 한 화면에 ── */
const sheets = {};
function makeSheet(key, items, opts){ sheets[key] = Object.assign({ key, items, picks:{}, instant:true, graded:false }, opts || {}); return sheets[key]; }
function qText(it){ return it.raw ? it.q : esc(it.q).replace('___', '<span class="blank">&nbsp;</span>'); }
function itemHTML(sh, i, o){
  o = o || {};
  const it = sh.items[i], pk = sh.picks[i], show = sh.graded || (sh.instant && pk !== undefined);
  const ok = pk !== undefined && it.order[pk] === it.a;
  let h = `<div class="item ${show ? (ok ? 'ok' : 'no') : ''}"><p class="q"><span class="n">${o.num || i + 1}</span>`;
  h += o.hideQ && !sh.graded ? '<span class="muted">(질문은 소리로)</span>' : qText(it);
  if (o.tag) h += `<span class="tag">${o.tag}</span>`;
  h += `</p><div class="opts">`;
  it.order.forEach((x, k) => {
    let c = 'opt';
    if (show) { if (x === it.a) c += ' right'; else if (k === pk) c += ' wrong'; }
    else if (k === pk) c += ' picked';
    h += `<button class="${c}" data-sh="${sh.key}" data-i="${i}" data-k="${k}" ${show ? 'disabled' : ''}><span class="bub">${LET[k]}</span><span>${esc(x)}</span></button>`;
  });
  h += `</div>`;
  if (show && it.e) h += `<p class="explain">${esc(it.e)}</p>`;
  return h + `</div>`;
}
function sheetScore(sh){ let c = 0, n = 0; for (const i in sh.picks) { n++; if (sh.items[i].order[sh.picks[i]] === sh.items[i].a) c++; } return { c, n }; }
function recordGrammar(it, ok){
  if (!TYPES[it.t] || !it.id.startsWith('g')) return;
  const st = S.stats[it.t] = S.stats[it.t] || { c:0, n:0 }; st.n++; if (ok) st.c++;
  if (!ok) S.wrong[it.id] = 2; else if (S.wrong[it.id]) { S.wrong[it.id]--; if (!S.wrong[it.id]) delete S.wrong[it.id]; }
}
function onPick(key, i, k){
  const sh = sheets[key]; if (!sh || sh.graded) return;
  if (sh.instant && sh.picks[i] !== undefined) return;
  sh.picks[i] = k;
  const it = sh.items[i], ok = it.order[k] === it.a;
  if (sh.instant) {
    if (sh.kind === 'g') { recordGrammar(it, ok); bump('g'); }
    else if (sh.kind === 'v') bump('v');
    if (sh.kind === 'r' || sh.kind === 'l') {
      const sc = sheetScore(sh);
      if (sc.n === sh.items.length) { S.best[sh.pid] = Math.max(S.best[sh.pid] || 0, sc.c); bump(sh.kind); }
    }
  }
  if (sh.kind === 'mock') { S.draft = { n: sh.n, picks: sh.picks }; }
  save(); keepScroll(render);
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }

function weakest(){ let w = null; for (const k in S.stats) { const s = S.stats[k]; if (s.n >= 4) { const r = s.c / s.n; if (!w || r < w.r) w = { k, r }; } } return w; }

/* ── 문법 ── */
let gMode = 'tense';
function grammarSheet(mode){
  let items, opts = { kind:'g' };
  if (mode === 'real') { items = withOrder(realGrammar()); opts.instant = false; opts.t0 = Date.now(); }
  else if (mode === 'wrong') items = withOrder(shuffle(GQ.filter(q => S.wrong[q.id])));
  else if (mode === 'all') items = withOrder(shuffle(GQ));
  else if (mode === 'verbs') { items = withOrder(verbItems()); opts.kind = 'drill'; }
  else items = withOrder(GQ.filter(q => q.t === mode));
  gMode = mode; return makeSheet('g', items, opts);
}
function viewGrammar(){
  const sh = sheets.g || grammarSheet(gMode);
  const sc = sheetScore(sh), wrongN = Object.keys(S.wrong).length;
  const chips = typeKeys.map(k => {
    const st = S.stats[k], cnt = GQ.filter(q => q.t === k).length;
    return `<button class="chip" data-gset="${k}" aria-pressed="${gMode === k}">${TYPES[k].name} ${cnt}${st ? ' · ' + Math.round(st.c / st.n * 100) + '%' : ''}</button>`;
  }).join('');
  let h = `<div class="sticky" style="display:flex;flex-direction:column;gap:8px">
    <div class="row between"><h1>문법 <span class="label" style="font-family:var(--body)">시험 26문항 · ${GQ.length}문제 수록</span></h1>
      <span class="num">${sh.instant ? `${sc.c}/${sc.n} 맞힘 · ${sh.items.length}문제` : `<span id="clock">0:00</span> · ${sc.n}/${sh.items.length} 표시`}</span></div>
    <div class="row">${chips}
      <button class="chip" data-gset="all" aria-pressed="${gMode === 'all'}">전체 ${GQ.length}</button>
      <button class="chip" data-gset="real" aria-pressed="${gMode === 'real'}">실전 26 (시간)</button>
      <button class="chip" data-gset="wrong" aria-pressed="${gMode === 'wrong'}" ${wrongN ? '' : 'disabled'}>오답노트 ${wrongN}</button>
      <button class="chip" data-gset="verbs" aria-pressed="${gMode === 'verbs'}">동사 뒤 모양 퀴즈</button></div>
  </div>`;
  if (TYPES[gMode]) h += `<p class="explain"><b>${TYPES[gMode].name} 공식</b> · ${esc(TYPES[gMode].tip)} <a href="#notes">요약노트</a></p>`;
  if (gMode === 'real') h += `<p class="explain">실제 시험 비율(시제 6 · 가정법 6 · 준동사 6 · 당위성 2 · 조동사 2 · 관계사 2 · 연결어 2)로 뽑았어요. 다 풀고 맨 아래 <b>채점</b>을 누르세요. 목표 20분, 24개.</p>`;
  if (!sh.items.length) return h + `<p class="muted">풀 문제가 없어요.</p>`;
  h += `<div class="qs">${sh.items.map((it, i) => itemHTML(sh, i, { tag: gMode === 'all' || gMode === 'wrong' ? TYPES[it.t].name : '' })).join('')}</div>`;
  if (!sh.instant) {
    if (!sh.graded) h += `<button class="btn primary" data-grade="g" style="align-self:center">채점 (${sc.n}/26 표시)</button>`;
    else { const m = Math.round((sh.t1 - sh.t0) / 60000); h += `<section class="sheet"><span class="score-big num ${sc.c >= 24 ? 'pass' : 'fail'}">${sc.c}/26 · ${sec(sc.c, 26)}점</span><p>걸린 시간 ${m}분. 틀린 문제는 오답노트에 들어갔어요.</p><button class="btn primary" data-gset="real">새 실전 26</button></section>`; }
  } else h += `<div class="row" style="justify-content:center"><button class="btn" data-gset="${gMode}">${gMode === 'wrong' ? '오답노트 다시' : '섞어서 다시 풀기'}</button></div>`;
  return h;
}

/* ── 독해 ── */

      <td class="m" data-reveal><span class="${S.hideM ? 'hidden-m' : ''}">${esc(v.m)}</span></td><td class="muted"><span class="${S.hideM ? 'hidden-m' : ''}">${esc(v.s)}</span></td></tr>`).join('')}</table></div>`;
  h += `<div class="grid wide"><section class="sheet">${table(list.slice(0, half))}</section>${list.length > half ? `<section class="sheet">${table(list.slice(half))}</section>` : ''}</div>`;

/* ── 청취 ── */
let lId = 'l1', rate = 0.9, showQ = false;
const synth = window.speechSynthesis;
function voices(){
  const all = synth ? synth.getVoices().filter(v => /^en[-_]/i.test(v.lang)) : [];
  const us = all.filter(v => /US/i.test(v.lang)); const pool = us.length ? us : all;
  const f = pool.find(v => /female|samantha|zira|aria|jenny|google us english/i.test(v.name)) || pool[0];
  const m = pool.find(v => v !== f && /male|alex|david|guy|daniel|fred/i.test(v.name)) || pool.find(v => v !== f) || f;
  return [f, m];
}
function play(id){
  if (!synth) return toast('이 브라우저는 영어 음성 읽기를 지원하지 않아요');
  const s = LISTENING.find(x => x.id === id); synth.cancel();
  const [f, m] = voices();
  const qs = s.q.map((q, i) => [2, 'Number ' + (i + 1) + '. ' + q[0]]);
  [[2, 'Listen to the questions first.']].concat(qs, [[2, 'Now listen.']], s.lines, [[2, 'Now listen to the questions again.']], qs).forEach(([who, text]) => {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate;
    const v = who === 1 ? m : f; if (v) u.voice = v; if (who === 1 && v === f) u.pitch = 0.75;
    synth.speak(u);
  });
}
const playerHTML = id => `<div class="row"><button class="btn primary" data-play="${id}">▶ 듣기</button><button class="btn" data-stop>■ 멈추기</button>
  <label class="row" style="gap:5px"><span class="label">속도</span><select id="rate">${[0.8, 0.9, 1].map(r => `<option value="${r}" ${r === rate ? 'selected' : ''}>${r}x</option>`).join('')}</select></label></div>`;
const scriptHTML = s => `<details><summary>대본 보기</summary><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">${s.lines.map(l => `<p>${s.lines.some(x => x[0] === 1) ? `<b class="label">${l[0] ? 'B' : 'A'}</b> ` : ''}${esc(l[1])}</p>`).join('')}</div></details>`;
function viewListening(){
  const s = LISTENING.find(x => x.id === lId);
  const key = 'l-' + s.id; const sh = sheets[key] || makeSheet(key, lItems(s), { kind:'l', pid:s.id });
  const sc = sheetScore(sh), fin = sc.n === sh.items.length;
  return `<div class="row between"><h1>청취 <span class="label" style="font-family:var(--body)">시험 26문항 = 7·6·6·7</span></h1><span class="num">${sc.c}/${sc.n} 맞힘</span></div>
    <div class="row">${LISTENING.map((x, i) => `<button class="chip" data-lid="${x.id}" aria-pressed="${x.id === lId}">${i < 4 ? '1회' : '2회'} · ${x.part.split(' · ')[0]} ${x.part.split(' · ')[1]}${S.best[x.id] !== undefined ? ' · ' + S.best[x.id] + '/' + x.q.length : ''}</button>`).join('')}</div>
    <section class="sheet"><div class="row between"><h2>${esc(s.title)} <span class="label">${s.part}</span></h2>
      <button class="chip" data-showq aria-pressed="${showQ}">질문 글로 보기</button></div>
      ${playerHTML(s.id)}
      <p class="muted">질문 → 본문 → 질문 다시 순서로 기기의 영어 음성이 읽어요. 실전처럼 질문은 귀로 듣고 키워드를 메모하세요. 소리가 안 나면 기기 설정에서 영어 음성을 받아 두세요.</p>
      ${fin ? scriptHTML(s) : ''}</section>
    <div class="qs">${sh.items.map((_, i) => itemHTML(sh, i, { hideQ: !showQ && !fin })).join('')}</div>
    ${fin ? `<button class="btn" data-lreset="${s.id}" style="align-self:center">다시 풀기</button>` : ''}`;
}

/* ── 모의고사 + 점수 ── */
let mockN = 0, sim = { g:24, l:11, r:17 };
function mockSheet(n){
  const items = [], meta = [];
  mockGrammar(n).forEach(it => { items.push(it); meta.push({ s:'g' }); });
  LISTENING.slice((n - 1) * 4, n * 4).forEach((s, si) => lItems(s, rng(n * 7 + si)).forEach(it => { items.push(it); meta.push({ s:'l', set:s.id }); }));
  READING.slice((n - 1) * 4, n * 4).forEach((p, pi) => rItems(p, rng(n * 11 + pi)).forEach(it => { items.push(it); meta.push({ s:'r', set:p.id }); }));
  const sh = makeSheet('mock', items, { kind:'mock', n, meta, instant:false });
  if (S.draft && S.draft.n === n) sh.picks = Object.assign({}, S.draft.picks);
  return sh;
}
function viewMock(){
  let h = `<h1>모의고사 <span class="label" style="font-family:var(--body)">문법 26 · 청취 26 · 독해 28 = 80문항</span></h1>
    <div class="row"><button class="chip" data-mock="1" aria-pressed="${mockN === 1}">모의고사 1회</button><button class="chip" data-mock="2" aria-pressed="${mockN === 2}">모의고사 2회</button>
    ${S.draft ? `<span class="label">${S.draft.n}회 푸는 중 (${Object.keys(S.draft.picks).length}/80) · 고른 답은 저장돼요</span>` : ''}</div>`;
  if (mockN) {
    const sh = sheets.mock && sheets.mock.n === mockN ? sheets.mock : mockSheet(mockN);
    const secN = { g:0, l:0, r:0 }; let num = 0;
    h += `<p class="explain">실제 순서대로 문법 → 청취 → 독해. 문법은 20분 안에, 청취는 세트마다 ▶ 듣기를 누르고, 독해는 남은 시간에. 끝나면 맨 아래 <b>채점</b>.</p>`;
    h += `<h2>문법 1~26</h2><div class="qs">`;
    let i = 0;
    for (; i < sh.items.length && sh.meta[i].s === 'g'; i++) h += itemHTML(sh, i, { num: ++secN.g });
    h += `</div><h2>청취 1~26</h2>`;
    while (i < sh.items.length && sh.meta[i].s === 'l') {
      const set = sh.meta[i].set, s = LISTENING.find(x => x.id === set);
      h += `<section class="sheet"><h3>${s.part}</h3>${playerHTML(s.id)}${sh.graded ? scriptHTML(s) : ''}<div class="qs">`;
      for (; i < sh.items.length && sh.meta[i].set === set; i++) h += itemHTML(sh, i, { num: ++secN.l, hideQ:true });
      h += `</div></section>`;
    }
    h += `<h2>독해 1~28</h2>`;
    while (i < sh.items.length && sh.meta[i].s === 'r') {
      const set = sh.meta[i].set, p = READING.find(x => x.id === set);
      h += `<div class="read"><div class="passage"><h3>${esc(p.title)}</h3><span class="label">${p.part}</span>\n\n${esc(p.body)}</div><div style="display:flex;flex-direction:column;gap:10px">`;
      for (; i < sh.items.length && sh.meta[i].set === set; i++) h += itemHTML(sh, i, { num: ++secN.r });
      h += `</div></div>`;
    }
    if (!sh.graded) h += `<button class="btn primary" data-grade="mock" style="align-self:center">채점 (${Object.keys(sh.picks).length}/80 표시)</button>`;
    else {
      const c = { g:0, l:0, r:0 };
      sh.items.forEach((it, k) => { if (sh.picks[k] !== undefined && it.order[sh.picks[k]] === it.a) c[sh.meta[k].s]++; });
      const t = total(c.g, c.l, c.r);
      h += `<section class="sheet"><h2>모의고사 ${mockN}회 결과</h2><div class="row" style="gap:20px;align-items:baseline">
        <span class="score-big num ${t >= 65 ? 'pass' : 'fail'}">${t}</span>
        <span class="num">문법 ${c.g}/26 (${sec(c.g, 26)}) · 청취 ${c.l}/26 (${sec(c.l, 26)}) · 독해 ${c.r}/28 (${sec(c.r, 28)})</span></div>
        <p>${t >= 65 ? '65점 통과 점수예요. 기록에 저장했어요.' : '65점까지 ' + (65 - t) + '점. 기록에 저장했어요. 가장 낮은 영역을 Day 계획에서 다시 보세요.'}</p></section>`;
    }
  }
  const tt = total(sim.g, sim.l, sim.r);
  h += `<div class="grid"><section class="sheet"><h2>점수 계산기</h2>
      ${[['g','문법',26],['r','독해',28],['l','청취',26]].map(([k, n, max]) => `<label class="stat" for="sim-${k}"><span>${n} <span class="num muted">${sec(sim[k], max)}</span></span><input type="range" id="sim-${k}" data-sim="${k}" min="0" max="${max}" value="${sim[k]}"><span class="num">${sim[k]}/${max}</span></label>`).join('')}
      <div class="row" style="align-items:baseline;gap:12px"><span class="score-big num ${tt >= 65 ? 'pass' : 'fail'}">${tt}</span><span>${tt >= 65 ? '65점 통과' : '65점까지 ' + (65 - tt) + '점'}</span></div></section>
    <section class="sheet"><h2>점수 기록</h2>
      <form id="mockform" class="row" style="align-items:flex-end">
        <div class="field"><label class="label" for="m-d">날짜</label><input type="date" id="m-d" value="${today()}" required></div>
        <div class="field"><label class="label" for="m-g">문법</label><input type="number" id="m-g" min="0" max="100" required></div>
        <div class="field"><label class="label" for="m-r">독해</label><input type="number" id="m-r" min="0" max="100" required></div>
        <div class="field"><label class="label" for="m-l">청취</label><input type="number" id="m-l" min="0" max="100" required></div>
        <button class="btn primary">기록</button></form>${chart()}</section>
    <section class="sheet"><h2>문법 유형별 정답률</h2>${statBars()}
      <button class="btn small" data-reset style="align-self:flex-start">${resetArm ? '한 번 더 누르면 모두 삭제' : '기록 모두 지우기'}</button>
      <p class="muted">기록은 이 기기의 브라우저에만 저장돼요.</p></section></div>`;
  return h;
}
let resetArm = false;
function statBars(){
  let h = '', any = false;
  typeKeys.forEach(k => { const s = S.stats[k]; if (!s) return; any = true; const r = Math.round(s.c / s.n * 100);
    h += `<div class="stat"><span>${TYPES[k].name}</span><div class="bar"><i style="width:${r}%;background:${r >= 85 ? 'var(--ok)' : 'var(--omr)'}"></i></div><span class="num">${r}%</span></div>`; });
  return any ? h : '<p class="muted">문법을 풀면 유형별 정답률이 쌓여요.</p>';
}
function chart(){
  const ms = S.mocks.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  if (!ms.length) return `<p class="muted">모의고사를 채점하거나 실제 시험 점수를 적으면 65점 선과 함께 그래프가 그려져요.</p>`;
  const W = 320, H = 150, L = 30, R = 12, Tp = 10, B = 24;
  const x = i => ms.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (ms.length - 1);
  const y = v => Tp + (100 - v) * (H - Tp - B) / 100;
  const pts = ms.map((m, i) => [x(i), y(m.t)]);
  let s = `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="평균 점수 추이">`;
  [0, 50, 65, 100].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 65 ? 'var(--ok)' : 'var(--line)'}" stroke-dasharray="${v === 65 ? '4 3' : ''}" fill="none"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${v}</text>`);
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--omr)" stroke-width="2"/>`;
  ms.forEach((m, i) => s += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i === ms.length - 1 ? 5 : 3.5}" fill="${m.t >= 65 ? 'var(--ok)' : 'var(--omr)'}"/><text x="${pts[i][0]}" y="${H - 6}" text-anchor="middle">${m.d.slice(5).replace('-', '/')}</text>`);
  s += `</svg></div><div class="scroll"><table><tr><th>날짜</th><th>구분</th><th>문법</th><th>독해</th><th>청취</th><th>평균</th><th></th></tr>`;
  ms.slice().reverse().forEach(m => s += `<tr><td class="num">${m.d}</td><td>${m.k || '시험'}</td><td class="num">${m.g}</td><td class="num">${m.r}</td><td class="num">${m.l}</td><td class="num ${m.t >= 65 ? 'pass' : 'fail'}"><b>${m.t}</b></td><td><button class="btn small" data-del="${m.d}|${m.t}|${m.g}">삭제</button></td></tr>`);
  return s + `</table></div>`;
}

/* ── 라우팅 ── */
const VIEWS = { home:viewHome, notes:viewNotes, grammar:viewGrammar, reading:viewReading, vocab:viewVocab, listening:viewListening, mock:viewMock };
const route = () => { const r = (location.hash || '#home').slice(1); return VIEWS[r] ? r : 'home'; };
function render(){
  const r = route(); app.innerHTML = VIEWS[r]();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + r ? 'page' : 'false'));
}
window.addEventListener('hashchange', () => { if (synth) synth.cancel(); render(); window.scrollTo(0, 0); });
setInterval(() => { const c = document.getElementById('clock'), sh = sheets.g; if (c && sh && sh.t0) { const e = Math.floor(((sh.t1 || Date.now()) - sh.t0) / 1000); c.textContent = Math.floor(e / 60) + ':' + pad(e % 60); } }, 1000);

app.addEventListener('click', e => {
  const b = e.target.closest('button, td[data-reveal]'); if (!b) return;
  const d = b.dataset;
  if (d.sh) return onPick(d.sh, +d.i, +d.k);
  if (d.gset) { grammarSheet(d.gset); if (route() !== 'grammar') location.hash = 'grammar'; else { render(); window.scrollTo(0, 0); } return; }
  if (d.grade === 'g') { const sh = sheets.g; sh.graded = true; sh.t1 = Date.now(); sh.items.forEach((it, i) => { if (sh.picks[i] !== undefined) recordGrammar(it, it.order[sh.picks[i]] === it.a); else recordGrammar(it, false); }); bump('g', 26); return render(); }
  if (d.grade === 'mock') {
    const sh = sheets.mock; sh.graded = true; const c = { g:0, l:0, r:0 };
    sh.items.forEach((it, k) => { const ok = sh.picks[k] !== undefined && it.order[sh.picks[k]] === it.a; if (ok) c[sh.meta[k].s]++; if (sh.meta[k].s === 'g') recordGrammar(it, ok); });
    S.mocks.push({ d:today(), k:'모의 ' + sh.n + '회', g:sec(c.g, 26), r:sec(c.r, 28), l:sec(c.l, 26), t:total(c.g, c.l, c.r) });
    S.draft = null; save(); return keepScroll(render);
  }
  if (d.done) { S.done[d.done] = !S.done[d.done]; save(); return keepScroll(render); }
  if (d.rid) { rId = d.rid; render(); return; }
  if (d.rreset) { delete sheets['r-' + d.rreset]; return render(); }
  if (d.lid) { lId = d.lid; if (synth) synth.cancel(); return render(); }
  if (d.lreset) { delete sheets['l-' + d.lreset]; return render(); }
  if (d.showq !== undefined) { showQ = !showQ; return keepScroll(render); }
  if (d.play) return play(d.play);
  if (d.stop !== undefined) { if (synth) synth.cancel(); return; }
  if (d.vr) { vRange = +d.vr; return render(); }
  if (d.vf !== undefined) { vFilter = vFilter === 'all' ? 'unknown' : 'all'; return render(); }
  if (d.vhide !== undefined) { S.hideM = !S.hideM; save(); return keepScroll(render); }
  if (d.reveal !== undefined) { b.parentNode.querySelectorAll('.hidden-m').forEach(x => x.classList.remove('hidden-m')); return; }
  if (d.known) { if (S.known[d.known]) delete S.known[d.known]; else { S.known[d.known] = 1; bump('v'); } save(); return keepScroll(render); }
  if (d.syn !== undefined) { makeSheet('syn', withOrder(synItems(30)), { kind:'v' }); return render(); }
  if (d.synclose !== undefined) { delete sheets.syn; return render(); }
  if (d.mock) { mockN = +d.mock; if (!sheets.mock || sheets.mock.n !== mockN || sheets.mock.graded) mockSheet(mockN); return render(); }
  if (d.del) { const [dd, tt, gg] = d.del.split('|'); const i = S.mocks.findIndex(m => m.d === dd && String(m.t) === tt && String(m.g) === gg); if (i > -1) S.mocks.splice(i, 1); save(); return keepScroll(render); }
  if (d.reset !== undefined) { if (!resetArm) { resetArm = true; return keepScroll(render); } resetArm = false; S = blank(); S.start = today(); S.target = fromNum(dayNum(S.start) + 7); save(); toast('기록을 지웠어요'); return render(); }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sim) { sim[t.dataset.sim] = +t.value; keepScroll(render); const n = document.getElementById(t.id); if (n) n.focus(); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'target' && t.value) { S.target = t.value; save(); render(); toast('시험일을 바꿨어요'); }
  if (t.id === 'start' && t.value) { S.start = t.value; save(); render(); toast('Day 1 시작일을 바꿨어요'); }
  if (t.id === 'rate') rate = +t.value;
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => Math.max(0, Math.min(100, +document.getElementById(id).value));
  const m = { d: document.getElementById('m-d').value, k:'시험', g: v('m-g'), r: v('m-r'), l: v('m-l') };
  m.t = Math.round((m.g + m.r + m.l) / 3);
  S.mocks.push(m); save(); toast(m.t >= 65 ? m.t + '점! 목표 달성' : '평균 ' + m.t + '점 기록'); keepScroll(render);
});
render();
})();
</script>
